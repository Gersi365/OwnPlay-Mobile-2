name: Export Android apksigner 36

on:
  push:
    branches:
      - stage-31-qa-build-v27
    paths:
      - .github/workflows/export-apksigner-36.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android Build Tools 36
        run: sdkmanager "build-tools;36.0.0"
      - name: Package apksigner only
        run: |
          set -euo pipefail
          root="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$root/apksigner"
          test -f "$root/lib/apksigner.jar"
          mkdir -p out/apksigner-36.0.0/lib
          cp "$root/apksigner" out/apksigner-36.0.0/apksigner
          cp "$root/lib/apksigner.jar" out/apksigner-36.0.0/lib/apksigner.jar
          chmod 0755 out/apksigner-36.0.0/apksigner
          (cd out && sha256sum apksigner-36.0.0/apksigner apksigner-36.0.0/lib/apksigner.jar > APKSIGNER_SHA256.txt)
          tar -C out -czf apksigner-36.0.0-linux.tar.gz apksigner-36.0.0 APKSIGNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-36-0-0-linux
          path: apksigner-36.0.0-linux.tar.gz
          if-no-files-found: error
          retention-days: 1
