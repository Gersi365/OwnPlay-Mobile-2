name: Stage 28 custom logo integration

on:
  push:
    branches:
      - stage-28-live-custom-logo-personalization
    paths:
      - .github/workflows/stage-28-custom-logo-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-28-live-custom-logo-personalization
          fetch-depth: 0
      - name: Keep provider name separate from local override
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/app/ownplay/mobile/feature/settings/ui/LiveManagementScreen.kt"); t=p.read_text(); old="editNameValue = channel.localName ?: channel.name"; new="editNameValue = channel.localName.orEmpty()"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old, new, 1))'
      - name: Commit source fix
        shell: bash
        run: |
          git diff --check
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java/app/ownplay/mobile/feature/settings/ui/LiveManagementScreen.kt
          git diff --cached --quiet && { echo "No Stage 28 editor fix produced"; exit 1; }
          git commit -m "Stage 28: preserve provider name when editing logo"
          git push origin HEAD:stage-28-live-custom-logo-personalization
