name: Stage 29 download permission integration

on:
  push:
    branches:
      - stage-29-download-permission-orchestration
    paths:
      - .github/workflows/stage-29-download-permission-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-29-download-permission-orchestration
          fetch-depth: 0
      - name: Apply deterministic Stage 29 patch
        run: python3 tools/stage29_download_permissions.py
      - name: Commit source changes
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java/app/ownplay/mobile/downloads/domain/DownloadPermissionPolicy.kt
          git add app/src/main/java/app/ownplay/mobile/downloads/ui/DownloadPermissionDispatcher.kt
          git add app/src/main/java/app/ownplay/mobile/downloads/ui/DownloadControls.kt
          git add app/src/main/java/app/ownplay/mobile/feature/settings/ui/DownloadManagementScreen.kt
          git add app/src/test/java/app/ownplay/mobile/downloads/domain/DownloadPermissionPolicyTest.kt
          git diff --cached --quiet && { echo "No Stage 29 source changes produced"; exit 1; }
          git commit -m "Stage 29: gate download start and restart permissions"
          git push origin HEAD:stage-29-download-permission-orchestration

# integration trigger 2
