name: Apply QA v17 Library compact actions and fullscreen exit fix

on:
  push:
    branches:
      - qa-fix-v17-library-actions-fullscreen-exit

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: a7e1dcaead734dcf68a5cdc3e38f42b19ab9de06
      TARGET_BRANCH: stage-12-stabilization

    steps:
      - name: Checkout helper history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact target source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply focused Library and fullscreen fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          library = "app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt"
          downloads = "app/src/main/java/app/ownplay/mobile/downloads/ui/DownloadControls.kt"
          live = "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt"
          policy = "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveOrientationPolicy.kt"
          policy_test = "app/src/test/java/app/ownplay/mobile/feature/live/ui/LiveOrientationPolicyTest.kt"

          replace_once(
              library,
              '''                modifier = Modifier\n                    .fillMaxWidth()\n                    .height(176.dp)\n                    .background(OwnPlayColors.SurfaceElevated),''',
              '''                modifier = Modifier\n                    .fillMaxWidth()\n                    .height(176.dp)\n                    .clip(OwnPlayShapeTokens.Medium)\n                    .background(OwnPlayColors.SurfaceElevated),''',
          )

          replace_once(
              library,
              '''                Row(\n                    modifier = Modifier.fillMaxWidth(),\n                    horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Sm),\n                ) {\n                    OwnPlayPrimaryButton(\n                        text = "Resume",\n                        onClick = onResume,\n                        modifier = Modifier.weight(1f).height(44.dp),\n                    )\n                    OwnPlaySecondaryButton(\n                        text = "Play from Beginning",\n                        onClick = onBeginning,\n                        modifier = Modifier.weight(1f).height(44.dp),\n                    )\n                }''',
              '''                Row(\n                    horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Sm),\n                    verticalAlignment = Alignment.CenterVertically,\n                ) {\n                    OwnPlayPrimaryButton(\n                        text = "Resume",\n                        onClick = onResume,\n                        modifier = Modifier.height(40.dp),\n                    )\n                    OwnPlaySecondaryButton(\n                        text = "Start Over",\n                        onClick = onBeginning,\n                        modifier = Modifier.height(40.dp),\n                    )\n                }''',
          )

          replace_once(
              library,
              '''                modifier = Modifier\n                    .fillMaxWidth()\n                    .aspectRatio(0.68f)\n                    .background(OwnPlayColors.SurfaceElevated),''',
              '''                modifier = Modifier\n                    .fillMaxWidth()\n                    .aspectRatio(0.68f)\n                    .clip(OwnPlayShapeTokens.Small)\n                    .background(OwnPlayColors.SurfaceElevated),''',
          )

          replace_once(
              library,
              '''            if (movie.resumePositionMs != null) {\n                PlaybackChoiceButtons(\n                    preferResume = preferResume,\n                    onResume = onResume,\n                    onBeginning = onBeginning,\n                )\n            } else {\n                OwnPlayPrimaryButton(text = "Play", onClick = onBeginning, modifier = Modifier.fillMaxWidth().height(44.dp))\n            }\n            DownloadControls(item = downloadItem, onAction = onDownloadAction, compact = true)''',
              '''            if (movie.resumePositionMs != null) {\n                PlaybackChoiceButtons(\n                    preferResume = preferResume,\n                    onResume = onResume,\n                    onBeginning = onBeginning,\n                )\n                DownloadControls(item = downloadItem, onAction = onDownloadAction, compact = true)\n            } else {\n                Row(\n                    horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Sm),\n                    verticalAlignment = Alignment.CenterVertically,\n                ) {\n                    OwnPlayPrimaryButton(\n                        text = "Play",\n                        onClick = onBeginning,\n                        modifier = Modifier.height(40.dp),\n                    )\n                    DownloadControls(item = downloadItem, onAction = onDownloadAction, compact = true)\n                }\n            }''',
          )

          replace_once(
              library,
              '''            if (episode.resumePositionMs != null) {\n                PlaybackChoiceButtons(\n                    preferResume = preferResume,\n                    onResume = onResume,\n                    onBeginning = onBeginning,\n                )\n            } else {\n                OwnPlayPrimaryButton(text = "Play", onClick = onBeginning, modifier = Modifier.fillMaxWidth().height(44.dp))\n            }\n            DownloadControls(item = downloadItem, onAction = onDownloadAction, compact = true)''',
              '''            if (episode.resumePositionMs != null) {\n                PlaybackChoiceButtons(\n                    preferResume = preferResume,\n                    onResume = onResume,\n                    onBeginning = onBeginning,\n                )\n                DownloadControls(item = downloadItem, onAction = onDownloadAction, compact = true)\n            } else {\n                Row(\n                    horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Sm),\n                    verticalAlignment = Alignment.CenterVertically,\n                ) {\n                    OwnPlayPrimaryButton(\n                        text = "Play",\n                        onClick = onBeginning,\n                        modifier = Modifier.height(40.dp),\n                    )\n                    DownloadControls(item = downloadItem, onAction = onDownloadAction, compact = true)\n                }\n            }''',
          )

          replace_once(
              library,
              '''    Row(\n        modifier = Modifier.fillMaxWidth(),\n        horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Md),\n    ) {\n        if (preferResume) {\n            OwnPlayPrimaryButton("Resume", onResume, Modifier.weight(1f).height(44.dp))\n            OwnPlaySecondaryButton("Play from Beginning", onBeginning, Modifier.weight(1f).height(44.dp))\n        } else {\n            OwnPlayPrimaryButton("Play from Beginning", onBeginning, Modifier.weight(1f).height(44.dp))\n            OwnPlaySecondaryButton("Resume", onResume, Modifier.weight(1f).height(44.dp))\n        }\n    }''',
              '''    Row(\n        horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Sm),\n        verticalAlignment = Alignment.CenterVertically,\n    ) {\n        if (preferResume) {\n            OwnPlayPrimaryButton("Resume", onResume, Modifier.height(40.dp))\n            OwnPlaySecondaryButton("Start Over", onBeginning, Modifier.height(40.dp))\n        } else {\n            OwnPlayPrimaryButton("Start Over", onBeginning, Modifier.height(40.dp))\n            OwnPlaySecondaryButton("Resume", onResume, Modifier.height(40.dp))\n        }\n    }''',
          )

          replace_once(
              downloads,
              '''    Column(\n        modifier = modifier.fillMaxWidth(),\n        verticalArrangement = Arrangement.spacedBy(if (compact) OwnPlaySpacing.Xs else OwnPlaySpacing.Sm),\n    ) {''',
              '''    Column(\n        modifier = if (compact) modifier else modifier.fillMaxWidth(),\n        verticalArrangement = Arrangement.spacedBy(if (compact) OwnPlaySpacing.Xs else OwnPlaySpacing.Sm),\n    ) {''',
          )

          replace_once(
              downloads,
              '''                Box(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .height(4.dp)\n                        .clip(RoundedCornerShape(2.dp))\n                        .background(OwnPlayColors.Divider),''',
              '''                Box(\n                    modifier = (if (compact) Modifier.width(180.dp) else Modifier.fillMaxWidth())\n                        .height(4.dp)\n                        .clip(RoundedCornerShape(2.dp))\n                        .background(OwnPlayColors.Divider),''',
          )

          old_row = '''        Row(\n            modifier = Modifier.fillMaxWidth(),\n            horizontalArrangement = Arrangement.spacedBy(if (compact) OwnPlaySpacing.Xs else OwnPlaySpacing.Sm),\n        ) {\n            if (compact && primaryAction == DownloadAction.DOWNLOAD) {\n                OwnPlaySecondaryButton(\n                    text = actionLabel(primaryAction),\n                    onClick = { onAction(primaryAction) },\n                    modifier = Modifier.weight(1f).height(44.dp),\n                )\n            } else {\n                OwnPlayPrimaryButton(\n                    text = actionLabel(primaryAction),\n                    onClick = { onAction(primaryAction) },\n                    modifier = Modifier.weight(1f).height(if (compact) 44.dp else 52.dp),\n                )\n            }\n            if (item != null) {\n                OwnPlaySecondaryButton(\n                    text = "Remove",\n                    onClick = { onAction(DownloadAction.REMOVE) },\n                    modifier = Modifier.weight(0.7f).height(if (compact) 44.dp else 52.dp),\n                )\n            }\n        }'''
          new_row = '''        Row(\n            modifier = if (compact) Modifier else Modifier.fillMaxWidth(),\n            horizontalArrangement = Arrangement.spacedBy(if (compact) OwnPlaySpacing.Xs else OwnPlaySpacing.Sm),\n        ) {\n            if (compact) {\n                if (primaryAction == DownloadAction.DOWNLOAD) {\n                    OwnPlaySecondaryButton(\n                        text = actionLabel(primaryAction),\n                        onClick = { onAction(primaryAction) },\n                        modifier = Modifier.height(40.dp),\n                    )\n                } else {\n                    OwnPlayPrimaryButton(\n                        text = actionLabel(primaryAction),\n                        onClick = { onAction(primaryAction) },\n                        modifier = Modifier.height(40.dp),\n                    )\n                }\n                if (item != null) {\n                    OwnPlaySecondaryButton(\n                        text = "Remove",\n                        onClick = { onAction(DownloadAction.REMOVE) },\n                        modifier = Modifier.height(40.dp),\n                    )\n                }\n            } else {\n                OwnPlayPrimaryButton(\n                    text = actionLabel(primaryAction),\n                    onClick = { onAction(primaryAction) },\n                    modifier = Modifier.weight(1f).height(52.dp),\n                )\n                if (item != null) {\n                    OwnPlaySecondaryButton(\n                        text = "Remove",\n                        onClick = { onAction(DownloadAction.REMOVE) },\n                        modifier = Modifier.weight(0.7f).height(52.dp),\n                    )\n                }\n            }\n        }'''
          replace_once(downloads, old_row, new_row)

          replace_once(
              downloads,
              '''import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.shape.RoundedCornerShape''',
              '''import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.shape.RoundedCornerShape''',
          )

          replace_once(
              live,
              '''    var fallbackLoadRequest by remember { mutableStateOf<PlaybackLoadRequest?>(null) }\n    var waitingForInitialChannels by remember(catalog?.activeSourceId) { mutableStateOf(false) }''',
              '''    var fallbackLoadRequest by remember { mutableStateOf<PlaybackLoadRequest?>(null) }\n    var waitingForInitialChannels by remember(catalog?.activeSourceId) { mutableStateOf(false) }\n    var orientationFullscreenArmed by remember { mutableStateOf(true) }''',
          )

          replace_once(
              live,
              '''                    when {\n                        LiveOrientationPolicy.isLandscape(orientation) && !landscapeTriggered -> {\n                            landscapeTriggered = true\n                            dispatch(LiveIntent.ChannelTapped(selectedId))\n                        }\n                        LiveOrientationPolicy.isPortrait(orientation) -> landscapeTriggered = false\n                    }''',
              '''                    when {\n                        LiveOrientationPolicy.isPortrait(orientation) -> {\n                            landscapeTriggered = false\n                            orientationFullscreenArmed = true\n                        }\n                        LiveOrientationPolicy.shouldAutoEnterFullscreen(\n                            orientationDegrees = orientation,\n                            armed = orientationFullscreenArmed,\n                        ) && !landscapeTriggered -> {\n                            landscapeTriggered = true\n                            orientationFullscreenArmed = false\n                            dispatch(LiveIntent.ChannelTapped(selectedId))\n                        }\n                    }''',
          )

          replace_once(
              live,
              '''    BackHandler(enabled = presentationState.presentation != LivePresentation.BROWSE) {\n        dispatch(LiveIntent.BackPressed)\n    }''',
              '''    BackHandler(enabled = presentationState.presentation != LivePresentation.BROWSE) {\n        if (presentationState.presentation == LivePresentation.FULLSCREEN) {\n            orientationFullscreenArmed = false\n        }\n        dispatch(LiveIntent.BackPressed)\n    }''',
          )

          replace_once(
              live,
              '''            onBackToPreview = { dispatch(LiveIntent.BackPressed) },''',
              '''            onBackToPreview = {\n                orientationFullscreenArmed = false\n                dispatch(LiveIntent.BackPressed)\n            },''',
          )

          replace_once(
              policy,
              '''    fun isPortrait(orientationDegrees: Int): Boolean =\n        orientationDegrees in 0..30 || orientationDegrees in 150..210 || orientationDegrees in 330..359\n}''',
              '''    fun isPortrait(orientationDegrees: Int): Boolean =\n        orientationDegrees in 0..30 || orientationDegrees in 150..210 || orientationDegrees in 330..359\n\n    fun shouldAutoEnterFullscreen(orientationDegrees: Int, armed: Boolean): Boolean =\n        armed && isLandscape(orientationDegrees)\n}''',
          )

          replace_once(
              policy_test,
              '''        assertTrue(LiveOrientationPolicy.isPortrait(180))\n    }\n}''',
              '''        assertTrue(LiveOrientationPolicy.isPortrait(180))\n    }\n\n    @Test\n    fun `manual fullscreen exit stays in preview until portrait rearms orientation entry`() {\n        assertTrue(LiveOrientationPolicy.shouldAutoEnterFullscreen(90, armed = true))\n        assertFalse(LiveOrientationPolicy.shouldAutoEnterFullscreen(90, armed = false))\n        assertFalse(LiveOrientationPolicy.shouldAutoEnterFullscreen(0, armed = true))\n    }\n}''',
          )

          allowed = {library, downloads, live, policy, policy_test}
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"Unexpected changed files: {sorted(changed)}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Validate source without APK generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk app/build/outputs/bundle
          gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug
          test ! -d app/build/outputs/apk || test -z "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test ! -d app/build/outputs/bundle || test -z "$(find app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          git diff --exit-code -- app/schemas
          echo "PASS: compile/tests/lint; Room schema clean; no APK/AAB generated."

      - name: Commit and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add \
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt \
            app/src/main/java/app/ownplay/mobile/downloads/ui/DownloadControls.kt \
            app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt \
            app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveOrientationPolicy.kt \
            app/src/test/java/app/ownplay/mobile/feature/live/ui/LiveOrientationPolicyTest.kt
          git commit -m "Refine Library actions and fullscreen exit"
          new_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git push origin "$new_sha:refs/heads/$TARGET_BRANCH"
          echo "FINAL_SOURCE_SHA=$new_sha"
