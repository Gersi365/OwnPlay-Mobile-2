name: Stage 30 integration hardening

on:
  push:
    branches:
      - stage-30-integration-hardening
    paths:
      - .github/workflows/stage-30-hardening-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-30-integration-hardening
          fetch-depth: 0
      - name: Apply Stage 30 cancellation hardening
        run: python3 tools/stage30_cancellation_fix.py
      - name: Commit Stage 30 cancellation hardening
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java/app/ownplay/mobile/sources/data/SourceRepositoryImpl.kt
          git diff --cached --quiet && { echo "No Stage 30 cancellation changes produced"; exit 1; }
          git commit -m "Stage 30: preserve refresh cancellation semantics"
          git push origin HEAD:stage-30-integration-hardening

# cancellation hardening trigger
