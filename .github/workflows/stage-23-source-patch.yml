private fun LibraryAllGrid(
    kind: LibraryMediaKind,
    categoryName: String?,
    movies: List<LibraryMovie>,
    seriesItems: List<LibrarySeries>,
    onMovieSelected: (LibraryMovie) -> Unit,
    onSeriesSelected: (LibrarySeries) -> Unit,
    onBack: () -> Unit,
    modifier: Modifier = Modifier,
) {
    BackHandler(onBack = onBack)
    Column(modifier = modifier.fillMaxSize()) {
        OwnPlayTopBar(showTagline = false)
        Column(
            modifier = Modifier.padding(horizontal = OwnPlaySpacing.Lg, vertical = OwnPlaySpacing.Sm),
            verticalArrangement = Arrangement.spacedBy(2.dp),
        ) {
            Text(
                text = "‹ Library",
                modifier = Modifier
                    .clickable(onClick = onBack)
                    .padding(vertical = 10.dp),
                style = MaterialTheme.typography.labelLarge,
                color = OwnPlayColors.Accent,
                fontWeight = FontWeight.SemiBold,
            )
            Text(
                text = categoryName ?: if (kind == LibraryMediaKind.MOVIE) "Movies" else "Series",
                style = MaterialTheme.typography.headlineSmall,
                color = OwnPlayColors.TextPrimary,
                fontWeight = FontWeight.SemiBold,
            )
            Text(
                text = when (kind) {
                    LibraryMediaKind.MOVIE -> "${compactLibraryCount(movies.size)} movies"
                    LibraryMediaKind.EPISODE -> "${compactLibraryCount(seriesItems.size)} series"
                },
                style = MaterialTheme.typography.bodySmall,
                color = OwnPlayColors.TextMuted,
            )
        }
        LazyVerticalGrid(
            columns = GridCells.Fixed(3),
            modifier = Modifier
                .fillMaxWidth()
                .weight(1f),
            contentPadding = PaddingValues(
                start = OwnPlaySpacing.Lg,
                end = OwnPlaySpacing.Lg,
                top = OwnPlaySpacing.Sm,
                bottom = OwnPlaySpacing.Xl,
            ),
            horizontalArrangement = Arrangement.spacedBy(8.dp),
            verticalArrangement = Arrangement.spacedBy(10.dp),
        ) {
            when (kind) {
                LibraryMediaKind.MOVIE -> gridItems(
                    items = movies,
                    key = { movie -> movie.movieId },
                ) { movie ->
                    PosterCard(
                        title = movie.name,
                        artworkUrl = movie.posterUrl,
                        eyebrow = movie.rating?.let { "★ $it" } ?: "MOVIE",
                        cardWidth = null,
                        modifier = Modifier.fillMaxWidth(),
                        onClick = { onMovieSelected(movie) },
                    )
                }

                LibraryMediaKind.EPISODE -> gridItems(
                    items = seriesItems,
                    key = { series -> series.seriesId },
                ) { series ->
                    PosterCard(
                        title = series.name,
                        artworkUrl = series.posterUrl,
                        eyebrow = series.rating?.let { "★ $it" } ?: "SERIES",
                        cardWidth = null,
                        modifier = Modifier.fillMaxWidth(),
                        onClick = { onSeriesSelected(series) },
                    )
                }
            }
        }
    }
}

