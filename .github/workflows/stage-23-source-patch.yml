name: Stage 23 source patch runner

on:
  push:
    branches:
      - stage-23-library-curation-and-visibility

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair Stage 23 source patch runner'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 23 branch
        uses: actions/checkout@v4
        with:
          ref: stage-23-library-curation-and-visibility
          fetch-depth: 0

      - name: Apply deterministic source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage23_patch_core.py
          python3 .github/stage23_patch_downloads.py
          python3 .github/stage23_patch_browse.py
          python3 .github/stage23_patch_library.py
          git diff --check
          git status --short

      - name: Commit Stage 23 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java app/src/test/java
          test -n "$(git status --porcelain)"
          git commit -m "Stage 23: refine Library browsing and visibility"
          git push origin HEAD:stage-23-library-curation-and-visibility
