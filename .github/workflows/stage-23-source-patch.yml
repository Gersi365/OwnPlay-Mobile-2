name: Stage 23 source patch runner

on:
  push:
    branches:
      - stage-23-library-curation-and-visibility

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add Stage 23 source patch runner'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 23 branch
        uses: actions/checkout@v4
        with:
          ref: stage-23-library-curation-and-visibility
          fetch-depth: 0

      - name: Apply deterministic Stage 23 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          def replace_regex_once(path_str: str, pattern: str, replacement: str) -> None:
              import re
              path = Path(path_str)
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one match, found {count}: {pattern[:80]!r}")
              path.write_text(updated)

          visibility_path = Path("app/src/main/java/app/ownplay/mobile/data/prefs/LibraryVisibilityPreferences.kt")
          if visibility_path.exists():
              raise SystemExit(f"{visibility_path} already exists")
          visibility_path.write_text('''package app.ownplay.mobile.data.prefs

import android.content.Context
import androidx.datastore.preferences.core.Preferences
import androidx.datastore.preferences.core.edit
