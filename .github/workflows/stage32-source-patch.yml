name: Stage 32 source patch helper

on:
  push:
    branches:
      - stage-32-interaction-orientation-contract
    paths:
      - tools/stage32_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-32-interaction-orientation-contract
          fetch-depth: 0
      - name: Apply Stage 32 patch
        run: python3 tools/stage32_patch.py
      - name: Commit Stage 32 source changes
        run: |
          set -euo pipefail
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m 'Stage 32: harden interaction and orientation contract'
          git push origin HEAD:stage-32-interaction-orientation-contract
