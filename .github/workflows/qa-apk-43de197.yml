name: QA APK v34 for e54e08d

on:
  push:
    branches:
      - qa-apk-43de197
    paths:
      - '.github/workflows/qa-apk-43de197.yml'

permissions:
  contents: read

concurrency:
  group: qa-apk-v34-e54e08d
  cancel-in-progress: false

jobs:
  build-qa-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact validated product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e54e08d4d0c675075bb3849689adadb1c2b2bb94
          persist-credentials: false

      - name: Verify exact product source
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "e54e08d4d0c675075bb3849689adadb1c2b2bb94"
          echo "QA APK source HEAD: $actual_sha"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
          validate-wrappers: true

      - name: Build debug QA APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-build-cache --stacktrace

      - name: Verify APK, signer, and write QA metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p qa-artifact
          cp "$apk" qa-artifact/OwnPlay-Mobile-2-v34-qa-e54e08d.apk
          apk_sha="$(sha256sum qa-artifact/OwnPlay-Mobile-2-v34-qa-e54e08d.apk | awk '{print $1}')"
          apk_size="$(stat -c '%s' qa-artifact/OwnPlay-Mobile-2-v34-qa-e54e08d.apk)"
          signer_output="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs qa-artifact/OwnPlay-Mobile-2-v34-qa-e54e08d.apk)"
          signer_sha="$(printf '%s\n' "$signer_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$signer_sha"
          expected_signer='ade9e333ede9cc9bfe2d50b06c038092a869f04aa8699651bc7854a46c0d4fb1'
          {
            echo 'OwnPlay Mobile 2 — QA APK v34'
            echo 'Source SHA: e54e08d4d0c675075bb3849689adadb1c2b2bb94'
            echo 'Build type: debug QA'
            echo "APK SHA-256: $apk_sha"
            echo "APK bytes: $apk_size"
            echo "Signer certificate SHA-256: $signer_sha"
            echo "Expected installed QA signer SHA-256: $expected_signer"
            echo 'Package: app.ownplay.mobile'
            echo 'Version: 0.1.0-dev (1)'
          } > qa-artifact/QA_BUILD_METADATA.txt
          printf '%s\n' "$signer_output" > qa-artifact/APKSIGNER_VERIFY.txt
          cat qa-artifact/QA_BUILD_METADATA.txt
          if [ "$signer_sha" != "$expected_signer" ]; then
            echo 'ERROR: signer does not match the installed QA line; refusing to publish a non-update-compatible APK.' >&2
            exit 1
          fi

      - name: Upload update-compatible QA APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OwnPlay-Mobile-2-v34-qa-e54e08d
          path: qa-artifact/
          if-no-files-found: error
          retention-days: 7
