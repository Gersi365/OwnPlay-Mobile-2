name: Stage 26 source patch runner

on:
  push:
    branches:
      - stage-26-favorites-local-personalization

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add Stage 26 source patch runner'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 26 branch
        uses: actions/checkout@v4
        with:
          ref: stage-26-favorites-local-personalization
          fetch-depth: 0

      - name: Verify exact Stage 25 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "25a1f411ef998877735f89e28d14ca09d3fd48e5"

      - name: Apply Stage 26 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count} for {old!r}")
              target.write_text(text.replace(old, new))

          # Existing Room projections/queries: no entity/schema/version change.
          daos = "app/src/main/java/app/ownplay/mobile/data/db/Daos.kt"
          replace_exact(
              daos,
              '''    val streamLocator: String,\n    val sortOrder: Int,\n)\n''',
              '''    val streamLocator: String,\n    val favorite: Boolean,\n    val sortOrder: Int,\n)\n''',
          )
          replace_exact(
              daos,
              '''    val providerOrder: Int,\n    val hidden: Boolean,\n    val manualOrder: Int?,\n)\n\ndata class EpisodeLibraryView(\n''',
              '''    val providerOrder: Int,\n    val favorite: Boolean,\n    val localName: String?,\n    val hidden: Boolean,\n    val manualOrder: Int?,\n)\n\ndata class EpisodeLibraryView(\n''',
          )
          replace_exact(
              daos,
              '''            c.streamLocator AS streamLocator,\n            COALESCE(p.manualOrder, c.providerOrder) AS sortOrder\n''',
              '''            c.streamLocator AS streamLocator,\n            COALESCE(p.favorite, 0) AS favorite,\n            COALESCE(p.manualOrder, c.providerOrder) AS sortOrder\n''',
          )
          replace_exact(
              daos,
              '''            c.providerOrder AS providerOrder,\n            COALESCE(p.hidden, 0) AS hidden,\n            p.manualOrder AS manualOrder\n''',
              '''            c.providerOrder AS providerOrder,\n            COALESCE(p.favorite, 0) AS favorite,\n            p.localName AS localName,\n            COALESCE(p.hidden, 0) AS hidden,\n            p.manualOrder AS manualOrder\n''',
          )
          replace_exact(
              daos,
              '''    fun observeAvailableSeries(sourceId: String): Flow<List<SeriesEntity>>\n\n    @Query(\n        """\n        SELECT\n            e.episodeId AS episodeId,\n''',
              '''    fun observeAvailableSeries(sourceId: String): Flow<List<SeriesEntity>>\n\n    @Query(\n        """\n        SELECT * FROM media_favorites\n        WHERE sourceId = :sourceId\n        ORDER BY addedAt DESC, mediaKind ASC, contentId ASC\n        """,\n    )\n    fun observeMediaFavorites(sourceId: String): Flow<List<MediaFavoriteEntity>>\n\n    @Query(\n        """\n        SELECT * FROM media_favorites\n        WHERE sourceId = :sourceId\n          AND mediaKind = :mediaKind\n          AND contentId = :contentId\n        LIMIT 1\n        """,\n    )\n    suspend fun getMediaFavorite(sourceId: String, mediaKind: String, contentId: String): MediaFavoriteEntity?\n\n    @Upsert\n    suspend fun upsertMediaFavorite(row: MediaFavoriteEntity)\n\n    @Query(\n        """\n        DELETE FROM media_favorites\n        WHERE sourceId = :sourceId\n          AND mediaKind = :mediaKind\n          AND contentId = :contentId\n        """,\n    )\n    suspend fun deleteMediaFavorite(sourceId: String, mediaKind: String, contentId: String): Int\n\n    @Query(\n        """\n        SELECT\n            e.episodeId AS episodeId,\n''',
          )

          # Live domain exposes persisted favorite and local-name state.
          live_models = "app/src/main/java/app/ownplay/mobile/feature/live/domain/LiveModels.kt"
          replace_exact(
              live_models,
              '''    val logoUrl: String?,\n    val sortOrder: Int,\n)\n''',
              '''    val logoUrl: String?,\n    val sortOrder: Int,\n    val favorite: Boolean = false,\n)\n''',
          )
          replace_exact(
              live_models,
              '''    val providerOrder: Int,\n    val hidden: Boolean,\n    val manualOrder: Int?,\n)\n''',
              '''    val providerOrder: Int,\n    val favorite: Boolean,\n    val localName: String?,\n    val hidden: Boolean,\n    val manualOrder: Int?,\n)\n''',
          )
          replace_exact(
              live_models,
              '''    suspend fun setChannelHidden(channelId: String, hidden: Boolean)\n    suspend fun setCategoryOrder(sourceId: String, orderedCategoryKeys: List<String>)\n''',
              '''    suspend fun setChannelHidden(channelId: String, hidden: Boolean)\n    suspend fun setChannelFavorite(channelId: String, favorite: Boolean)\n    suspend fun setChannelLocalName(channelId: String, localName: String?)\n    suspend fun setCategoryOrder(sourceId: String, orderedCategoryKeys: List<String>)\n''',
          )

          Path("app/src/main/java/app/ownplay/mobile/feature/live/domain/LivePersonalizationPolicy.kt").write_text('''package app.ownplay.mobile.feature.live.domain\n\nobject LivePersonalizationPolicy {\n    const val MAX_LOCAL_NAME_LENGTH: Int = 120\n\n    fun normalizeLocalName(value: String?): String? = value\n        ?.trim()\n        ?.take(MAX_LOCAL_NAME_LENGTH)\n        ?.takeIf { it.isNotEmpty() }\n}\n''')

          # Live repository maps/mutates the existing channel_personalization table.
          live_repo = "app/src/main/java/app/ownplay/mobile/feature/live/data/LiveRepositoryImpl.kt"
          replace_exact(
              live_repo,
              '''import app.ownplay.mobile.feature.live.domain.LivePlaybackResolution\nimport app.ownplay.mobile.feature.live.domain.ManageableLiveCategory\n''',
              '''import app.ownplay.mobile.feature.live.domain.LivePlaybackResolution\nimport app.ownplay.mobile.feature.live.domain.LivePersonalizationPolicy\nimport app.ownplay.mobile.feature.live.domain.ManageableLiveCategory\n''',
          )
          replace_exact(
              live_repo,
              '''                                logoUrl = row.logoUrl,\n                                sortOrder = row.sortOrder,\n                            )\n''',
              '''                                logoUrl = row.logoUrl,\n                                sortOrder = row.sortOrder,\n                                favorite = row.favorite,\n                            )\n''',
          )
          replace_exact(
              live_repo,
              '''                                    logoUrl = row.logoUrl,\n                                    providerOrder = row.providerOrder,\n                                    hidden = row.hidden,\n                                    manualOrder = row.manualOrder,\n''',
              '''                                    logoUrl = row.logoUrl,\n                                    providerOrder = row.providerOrder,\n                                    favorite = row.favorite,\n                                    localName = row.localName,\n                                    hidden = row.hidden,\n                                    manualOrder = row.manualOrder,\n''',
          )
          replace_exact(
              live_repo,
              '''    override suspend fun setChannelHidden(channelId: String, hidden: Boolean) {\n        if (channelId.isBlank()) return\n        database.withTransaction {\n            if (catalogDao.getLiveChannel(channelId) == null) return@withTransaction\n            val current = catalogDao.getChannelPersonalization(channelId)\n            catalogDao.upsertChannelPersonalization(\n                (current ?: ChannelPersonalizationEntity(channelId = channelId)).copy(hidden = hidden),\n            )\n        }\n    }\n\n    override suspend fun setCategoryOrder(sourceId: String, orderedCategoryKeys: List<String>) {\n''',
              '''    override suspend fun setChannelHidden(channelId: String, hidden: Boolean) {\n        if (channelId.isBlank()) return\n        database.withTransaction {\n            if (catalogDao.getLiveChannel(channelId) == null) return@withTransaction\n            val current = catalogDao.getChannelPersonalization(channelId)\n            catalogDao.upsertChannelPersonalization(\n                (current ?: ChannelPersonalizationEntity(channelId = channelId)).copy(hidden = hidden),\n            )\n        }\n    }\n\n    override suspend fun setChannelFavorite(channelId: String, favorite: Boolean) {\n        if (channelId.isBlank()) return\n        database.withTransaction {\n            if (catalogDao.getLiveChannel(channelId) == null) return@withTransaction\n            val current = catalogDao.getChannelPersonalization(channelId)\n            catalogDao.upsertChannelPersonalization(\n                (current ?: ChannelPersonalizationEntity(channelId = channelId)).copy(favorite = favorite),\n            )\n        }\n    }\n\n    override suspend fun setChannelLocalName(channelId: String, localName: String?) {\n        if (channelId.isBlank()) return\n        val normalized = LivePersonalizationPolicy.normalizeLocalName(localName)\n        database.withTransaction {\n            if (catalogDao.getLiveChannel(channelId) == null) return@withTransaction\n            val current = catalogDao.getChannelPersonalization(channelId)\n            catalogDao.upsertChannelPersonalization(\n                (current ?: ChannelPersonalizationEntity(channelId = channelId)).copy(localName = normalized),\n            )\n        }\n    }\n\n    override suspend fun setCategoryOrder(sourceId: String, orderedCategoryKeys: List<String>) {\n''',
          )

          # Pure browsing policy keeps favorite filtering deterministic/testable.
          browse_policy = "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveBrowsePolicy.kt"
          replace_exact(
              browse_policy,
              '''import app.ownplay.mobile.feature.live.domain.LiveCategory\n''',
              '''import app.ownplay.mobile.feature.live.domain.LiveCategory\nimport app.ownplay.mobile.feature.live.domain.LiveChannel\n''',
          )
          replace_exact(
              browse_policy,
              '''    fun activeCategoryKey(\n''',
              '''    fun favoriteChannels(channels: List<LiveChannel>): List<LiveChannel> =\n        channels.filter { channel -> channel.favorite }\n\n    fun activeCategoryKey(\n''',
          )

          # Live UI: Favorites filter and contextual favorite action outside video controls.
          live_ui = "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt"
          replace_exact(
              live_ui,
              '''    var searchVisible by remember(catalog?.activeSourceId) { mutableStateOf(false) }\n    var searchQuery by remember(catalog?.activeSourceId) { mutableStateOf("") }\n''',
              '''    var searchVisible by remember(catalog?.activeSourceId) { mutableStateOf(false) }\n    var searchQuery by remember(catalog?.activeSourceId) { mutableStateOf("") }\n    var favoritesOnly by remember(catalog?.activeSourceId) { mutableStateOf(false) }\n''',
          )
          replace_exact(
              live_ui,
              '''    val normalizedSearchQuery = searchQuery.trim()\n    val searchActive = normalizedSearchQuery.isNotEmpty()\n    val visibleChannels = remember(channels, activeCategoryKey, searchActive, normalizedSearchQuery) {\n        if (searchActive) {\n            channels.filter { channel -> channel.name.contains(normalizedSearchQuery, ignoreCase = true) }\n        } else {\n            activeCategoryKey?.let { key ->\n                channels.filter { channel -> channel.categoryKey == key }\n            } ?: channels\n        }\n    }\n    val showCategories = categories.isNotEmpty() && !searchActive\n''',
              '''    val normalizedSearchQuery = searchQuery.trim()\n    val searchActive = normalizedSearchQuery.isNotEmpty()\n    val favoriteChannels = remember(channels) { LiveBrowsePolicy.favoriteChannels(channels) }\n    val visibleChannels = remember(\n        channels,\n        favoriteChannels,\n        activeCategoryKey,\n        favoritesOnly,\n        searchActive,\n        normalizedSearchQuery,\n    ) {\n        when {\n            searchActive -> channels.filter { channel ->\n                channel.name.contains(normalizedSearchQuery, ignoreCase = true)\n            }\n            favoritesOnly -> favoriteChannels\n            else -> activeCategoryKey?.let { key ->\n                channels.filter { channel -> channel.categoryKey == key }\n            } ?: channels\n        }\n    }\n    val showCategories = !searchActive && (categories.isNotEmpty() || favoriteChannels.isNotEmpty())\n''',
          )
          replace_exact(
              live_ui,
              '''    LaunchedEffect(categories, selectedCategoryKey) {\n''',
              '''    LaunchedEffect(favoriteChannels.isEmpty(), favoritesOnly) {\n        if (favoritesOnly && favoriteChannels.isEmpty()) favoritesOnly = false\n    }\n\n    LaunchedEffect(categories, selectedCategoryKey) {\n''',
          )
          replace_exact(
              live_ui,
              '''            categories = categories,\n            liveRepository = liveRepository,\n            selectedCategoryKey = activeCategoryKey,\n''',
              '''            categories = categories,\n            favoriteCount = favoriteChannels.size,\n            favoritesOnly = favoritesOnly,\n            liveRepository = liveRepository,\n            selectedCategoryKey = activeCategoryKey,\n''',
          )
          replace_exact(
              live_ui,
              '''            onCategorySelected = { categoryKey ->\n                selectedCategoryKey = categoryKey\n                if (\n                    presentationState.presentation == LivePresentation.PREVIEW &&\n                    selectedChannel?.categoryKey != categoryKey\n                ) {\n                    dispatch(LiveIntent.BackPressed)\n                }\n            },\n            selectedChannel = selectedChannel,\n''',
              '''            onFavoriteFilterSelected = {\n                favoritesOnly = true\n                if (\n                    presentationState.presentation == LivePresentation.PREVIEW &&\n                    selectedChannel?.favorite != true\n                ) {\n                    dispatch(LiveIntent.BackPressed)\n                }\n            },\n            onCategorySelected = { categoryKey ->\n                favoritesOnly = false\n                selectedCategoryKey = categoryKey\n                if (\n                    presentationState.presentation == LivePresentation.PREVIEW &&\n                    selectedChannel?.categoryKey != categoryKey\n                ) {\n                    dispatch(LiveIntent.BackPressed)\n                }\n            },\n            selectedChannel = selectedChannel,\n''',
          )
          replace_exact(
              live_ui,
              '''            listState = browseListState,\n            onChannelTapped = { channel -> dispatch(LiveIntent.ChannelTapped(channel.channelId)) },\n            modifier = modifier,\n''',
              '''            listState = browseListState,\n            onChannelTapped = { channel -> dispatch(LiveIntent.ChannelTapped(channel.channelId)) },\n            onChannelFavoriteToggle = { channel ->\n                scope.launch { liveRepository.setChannelFavorite(channel.channelId, !channel.favorite) }\n                if (\n                    favoritesOnly &&\n                    channel.favorite &&\n                    presentationState.presentation == LivePresentation.PREVIEW &&\n                    selectedChannel?.channelId == channel.channelId\n                ) {\n                    dispatch(LiveIntent.BackPressed)\n                }\n            },\n            modifier = modifier,\n''',
          )
          replace_exact(
              live_ui,
              '''    channels: List<LiveChannel>,\n    categories: List<LiveCategory>,\n    liveRepository: LiveRepository,\n''',
              '''    channels: List<LiveChannel>,\n    categories: List<LiveCategory>,\n    favoriteCount: Int,\n    favoritesOnly: Boolean,\n    liveRepository: LiveRepository,\n''',
          )
          replace_exact(
              live_ui,
              '''    onSearchQueryChange: (String) -> Unit,\n    onCategorySelected: (String?) -> Unit,\n    selectedChannel: LiveChannel?,\n''',
              '''    onSearchQueryChange: (String) -> Unit,\n    onFavoriteFilterSelected: () -> Unit,\n    onCategorySelected: (String?) -> Unit,\n    selectedChannel: LiveChannel?,\n''',
          )
          replace_exact(
              live_ui,
              '''    listState: LazyListState,\n    onChannelTapped: (LiveChannel) -> Unit,\n    modifier: Modifier = Modifier,\n''',
              '''    listState: LazyListState,\n    onChannelTapped: (LiveChannel) -> Unit,\n    onChannelFavoriteToggle: (LiveChannel) -> Unit,\n    modifier: Modifier = Modifier,\n''',
          )
          replace_exact(
              live_ui,
              '''                LiveCategoryStrip(\n                    categories = categories,\n                    selectedCategoryKey = selectedCategoryKey,\n                    onSelected = onCategorySelected,\n                )\n''',
              '''                LiveCategoryStrip(\n                    categories = categories,\n                    favoriteCount = favoriteCount,\n                    favoritesOnly = favoritesOnly,\n                    selectedCategoryKey = selectedCategoryKey,\n                    onFavoritesSelected = onFavoriteFilterSelected,\n                    onSelected = onCategorySelected,\n                )\n''',
          )
          replace_exact(
              live_ui,
              '''                            showChannelLogos = showChannelLogos,\n                            onClick = { onChannelTapped(channel) },\n                        )\n''',
              '''                            showChannelLogos = showChannelLogos,\n                            onFavoriteToggle = { onChannelFavoriteToggle(channel) },\n                            onClick = { onChannelTapped(channel) },\n                        )\n''',
          )
          replace_exact(
              live_ui,
              '''private fun LiveCategoryStrip(\n    categories: List<LiveCategory>,\n    selectedCategoryKey: String?,\n    onSelected: (String?) -> Unit,\n) {\n    LazyRow(\n        contentPadding = PaddingValues(horizontal = OwnPlaySpacing.Lg),\n        horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Xs),\n    ) {\n        items(categories, key = { it.categoryKey }) { category ->\n            OwnPlayFilterChip(\n                label = category.name,\n                selected = selectedCategoryKey == category.categoryKey,\n                onClick = { onSelected(category.categoryKey) },\n            )\n        }\n    }\n}\n''',
              '''private fun LiveCategoryStrip(\n    categories: List<LiveCategory>,\n    favoriteCount: Int,\n    favoritesOnly: Boolean,\n    selectedCategoryKey: String?,\n    onFavoritesSelected: () -> Unit,\n    onSelected: (String?) -> Unit,\n) {\n    LazyRow(\n        contentPadding = PaddingValues(horizontal = OwnPlaySpacing.Lg),\n        horizontalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Xs),\n    ) {\n        if (favoriteCount > 0) {\n            item(key = "ownplay-favorites") {\n                OwnPlayFilterChip(\n                    label = "Favorites",\n                    selected = favoritesOnly,\n                    onClick = onFavoritesSelected,\n                )\n            }\n        }\n        items(categories, key = { it.categoryKey }) { category ->\n            OwnPlayFilterChip(\n                label = category.name,\n                selected = !favoritesOnly && selectedCategoryKey == category.categoryKey,\n                onClick = { onSelected(category.categoryKey) },\n            )\n        }\n    }\n}\n''',
          )
          replace_exact(
              live_ui,
              '''    guide: LiveNowNext,\n    showChannelLogos: Boolean,\n    onClick: () -> Unit,\n) {\n''',
              '''    guide: LiveNowNext,\n    showChannelLogos: Boolean,\n    onFavoriteToggle: () -> Unit,\n    onClick: () -> Unit,\n) {\n''',
          )
          replace_exact(
              live_ui,
              '''            Text(\n                text = "›",\n                style = MaterialTheme.typography.titleLarge,\n                color = if (selected) OwnPlayColors.Accent else OwnPlayColors.TextMuted,\n            )\n''',
              '''            Text(\n                text = if (channel.favorite) "★" else "☆",\n                modifier = Modifier\n                    .clickable(onClick = onFavoriteToggle)\n                    .padding(horizontal = 10.dp, vertical = 10.dp),\n                style = MaterialTheme.typography.titleMedium,\n                color = if (channel.favorite) OwnPlayColors.Accent else OwnPlayColors.TextMuted,\n            )\n            Text(\n                text = "›",\n                style = MaterialTheme.typography.titleLarge,\n                color = if (selected) OwnPlayColors.Accent else OwnPlayColors.TextMuted,\n            )\n''',
          )

          # Manage Live: expose favorite toggle and non-destructive local rename.
          manage_ui = "app/src/main/java/app/ownplay/mobile/feature/settings/ui/LiveManagementScreen.kt"
          replace_exact(
              manage_ui,
              '''                onToggleChannel = { channel ->\n                    scope.launch { liveRepository.setChannelHidden(channel.channelId, !channel.hidden) }\n                },\n                onMoveChannel = { channelId, direction ->\n''',
              '''                onToggleChannel = { channel ->\n                    scope.launch { liveRepository.setChannelHidden(channel.channelId, !channel.hidden) }\n                },\n                onToggleFavorite = { channel ->\n                    scope.launch { liveRepository.setChannelFavorite(channel.channelId, !channel.favorite) }\n                },\n                onRenameChannel = { channelId, localName ->\n                    scope.launch { liveRepository.setChannelLocalName(channelId, localName) }\n                },\n                onMoveChannel = { channelId, direction ->\n''',
          )
          replace_exact(
              manage_ui,
              '''    onBack: () -> Unit,\n    onToggleChannel: (ManageableLiveChannel) -> Unit,\n    onMoveChannel: (String, Int) -> Boolean,\n''',
              '''    onBack: () -> Unit,\n    onToggleChannel: (ManageableLiveChannel) -> Unit,\n    onToggleFavorite: (ManageableLiveChannel) -> Unit,\n    onRenameChannel: (String, String?) -> Unit,\n    onMoveChannel: (String, Int) -> Boolean,\n''',
          )
          replace_exact(
              manage_ui,
              '''    val reorderEnabled = normalizedQuery.isBlank()\n    val listState = rememberLazyListState()\n\n    Column(modifier = modifier.fillMaxSize()) {\n''',
              '''    val reorderEnabled = normalizedQuery.isBlank()\n    val listState = rememberLazyListState()\n    var renameChannelId by rememberSaveable(title) { mutableStateOf<String?>(null) }\n    var renameValue by rememberSaveable(title) { mutableStateOf("") }\n\n    Column(modifier = modifier.fillMaxSize()) {\n''',
          )
          replace_exact(
              manage_ui,
              '''        ManagementTools(\n            query = query,\n            placeholder = "Search channels",\n            onQueryChange = { query = it },\n            reorderEnabled = reorderEnabled,\n            hasManualOrder = channels.any { it.manualOrder != null },\n            onResetOrder = onResetOrder,\n        )\n\n        LazyColumn(\n''',
              '''        ManagementTools(\n            query = query,\n            placeholder = "Search channels",\n            onQueryChange = { query = it },\n            reorderEnabled = reorderEnabled,\n            hasManualOrder = channels.any { it.manualOrder != null },\n            onResetOrder = onResetOrder,\n        )\n\n        renameChannelId?.let { channelId ->\n            val target = channels.firstOrNull { it.channelId == channelId }\n            OwnPlayPanel(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = OwnPlaySpacing.Lg, vertical = OwnPlaySpacing.Xs),\n            ) {\n                Column(\n                    modifier = Modifier.padding(OwnPlaySpacing.Md),\n                    verticalArrangement = Arrangement.spacedBy(OwnPlaySpacing.Xs),\n                ) {\n                    Text(\n                        text = "Rename channel",\n                        style = MaterialTheme.typography.titleSmall,\n                        color = OwnPlayColors.TextPrimary,\n                        fontWeight = FontWeight.SemiBold,\n                    )\n                    Text(\n                        text = target?.name ?: "Channel",\n                        style = MaterialTheme.typography.bodySmall,\n                        color = OwnPlayColors.TextSecondary,\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis,\n                    )\n                    OutlinedTextField(\n                        value = renameValue,\n                        onValueChange = { renameValue = it },\n                        modifier = Modifier.fillMaxWidth(),\n                        singleLine = true,\n                        label = { Text("Local name") },\n                        supportingText = { Text("Leave blank to restore the provider name.") },\n                    )\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.End,\n                    ) {\n                        TextButton(onClick = { renameChannelId = null; renameValue = "" }) { Text("Cancel") }\n                        TextButton(\n                            onClick = {\n                                onRenameChannel(channelId, renameValue)\n                                renameChannelId = null\n                                renameValue = ""\n                            },\n                        ) { Text("Save") }\n                    }\n                }\n            }\n        }\n\n        LazyColumn(\n''',
          )
          replace_exact(
              manage_ui,
              '''                            Text(\n                                text = if (channel.hidden) "Hidden" else "Visible",\n                                style = MaterialTheme.typography.bodySmall,\n                                color = OwnPlayColors.TextSecondary,\n                                maxLines = 1,\n                            )\n                        }\n                        TextButton(\n                            onClick = { onToggleChannel(channel) },\n''',
              '''                            Text(\n                                text = buildList {\n                                    add(if (channel.hidden) "Hidden" else "Visible")\n                                    if (channel.favorite) add("Favorite")\n                                    if (channel.localName != null) add("Custom name")\n                                }.joinToString(" • "),\n                                style = MaterialTheme.typography.bodySmall,\n                                color = OwnPlayColors.TextSecondary,\n                                maxLines = 1,\n                            )\n                        }\n                        TextButton(\n                            onClick = { onToggleFavorite(channel) },\n                            contentPadding = PaddingValues(horizontal = OwnPlaySpacing.Xs),\n                        ) {\n                            Text(if (channel.favorite) "★" else "☆", style = MaterialTheme.typography.labelLarge)\n                        }\n                        TextButton(\n                            onClick = {\n                                renameChannelId = channel.channelId\n                                renameValue = channel.localName ?: channel.name\n                            },\n                            contentPadding = PaddingValues(horizontal = OwnPlaySpacing.Xs),\n                        ) {\n                            Text("Rename", style = MaterialTheme.typography.labelMedium)\n                        }\n                        TextButton(\n                            onClick = { onToggleChannel(channel) },\n''',
          )

          # Library model/repository favorite state uses existing media_favorites table.
          library_models = "app/src/main/java/app/ownplay/mobile/feature/library/domain/LibraryModels.kt"
          replace_exact(
              library_models,
              '''    val resumePositionMs: Long?,\n    val durationMs: Long?,\n)\n''',
              '''    val resumePositionMs: Long?,\n    val durationMs: Long?,\n    val favorite: Boolean = false,\n)\n''',
          )
          replace_exact(
              library_models,
              '''    val rating: String?,\n    val providerOrder: Int,\n)\n\ndata class LibraryEpisode(\n''',
              '''    val rating: String?,\n    val providerOrder: Int,\n    val favorite: Boolean = false,\n)\n\ndata class LibraryEpisode(\n''',
          )
          replace_exact(
              library_models,
              '''    suspend fun resolveEpisodePlayback(episodeId: String, startMode: LibraryStartMode): LibraryPlaybackResolution\n    suspend fun saveProgress(update: PlaybackProgressUpdate)\n}\n''',
              '''    suspend fun resolveEpisodePlayback(episodeId: String, startMode: LibraryStartMode): LibraryPlaybackResolution\n    suspend fun saveProgress(update: PlaybackProgressUpdate)\n    suspend fun setMovieFavorite(movieId: String, favorite: Boolean)\n    suspend fun setSeriesFavorite(seriesId: String, favorite: Boolean)\n}\n''',
          )

          library_repo = "app/src/main/java/app/ownplay/mobile/feature/library/data/LibraryRepositoryImpl.kt"
          replace_exact(
              library_repo,
              '''import app.ownplay.mobile.data.db.LibraryDao\nimport app.ownplay.mobile.data.db.MovieEntity\n''',
              '''import app.ownplay.mobile.data.db.LibraryDao\nimport app.ownplay.mobile.data.db.MediaFavoriteEntity\nimport app.ownplay.mobile.data.db.MovieEntity\n''',
          )
          replace_exact(
