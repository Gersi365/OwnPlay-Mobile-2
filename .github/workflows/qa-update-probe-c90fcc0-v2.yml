name: QA update probe for c90fcc0 v2

on:
  push:
    branches:
      - qa-update-probe-c90fcc0-v2
    paths:
      - '.github/workflows/qa-update-probe-c90fcc0-v2.yml'

permissions:
  contents: read

concurrency:
  group: qa-update-probe-c90fcc0-v2
  cancel-in-progress: false

jobs:
  build-update-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact update-probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d2d81fa95ea67d300626e1d976b2e2b5d33dd74
          persist-credentials: false

      - name: Verify exact update-probe source
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "4d2d81fa95ea67d300626e1d976b2e2b5d33dd74"
          grep -q 'versionCode = 2' app/build.gradle.kts
          echo "QA update-probe source HEAD: $actual_sha"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
          validate-wrappers: true

      - name: Build debug update probe APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-build-cache --stacktrace

      - name: Verify APK signer and metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p qa-update-artifact
          cp "$apk" qa-update-artifact/OwnPlay-Mobile-2-qa-update-v2.apk
          apk_sha="$(sha256sum qa-update-artifact/OwnPlay-Mobile-2-qa-update-v2.apk | awk '{print $1}')"
          signer_output="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs qa-update-artifact/OwnPlay-Mobile-2-qa-update-v2.apk)"
          signer_sha="$(printf '%s\n' "$signer_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$signer_sha"
          {
            echo 'OwnPlay Mobile 2 — QA update probe'
            echo 'Product source SHA: c90fcc036b8bcb135696cb6367d9bbbb198f1ac3'
            echo 'Update-probe source SHA: 4d2d81fa95ea67d300626e1d976b2e2b5d33dd74'
            echo 'Package: app.ownplay.mobile'
            echo 'Version: 0.1.0-dev (2)'
            echo "APK SHA-256: $apk_sha"
            echo "Signer certificate SHA-256: $signer_sha"
            echo 'Previous QA signer SHA-256: ade9e333ede9cc9bfe2d50b06c038092a869f04aa8699651bc7854a46c0d4fb1'
          } > qa-update-artifact/QA_UPDATE_METADATA.txt
          printf '%s\n' "$signer_output" > qa-update-artifact/APKSIGNER_VERIFY.txt
          cat qa-update-artifact/QA_UPDATE_METADATA.txt
          if [ "$signer_sha" = "ade9e333ede9cc9bfe2d50b06c038092a869f04aa8699651bc7854a46c0d4fb1" ]; then
            echo 'SIGNER_MATCH=YES' | tee qa-update-artifact/SIGNER_MATCH.txt
          else
            echo 'SIGNER_MATCH=NO' | tee qa-update-artifact/SIGNER_MATCH.txt
          fi

      - name: Upload update probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OwnPlay-Mobile-2-qa-update-v2
          path: qa-update-artifact/
          if-no-files-found: error
          retention-days: 7
