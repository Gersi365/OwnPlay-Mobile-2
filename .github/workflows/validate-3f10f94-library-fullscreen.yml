name: Validate exact 3f10f94 Library and fullscreen source

on:
  push:
    branches:
      - qa-validate-3f10f94-library-fullscreen

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 3f10f94bc603028731dae9dc3f21e3c28397a594

    steps:
      - name: Checkout exact final source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact final source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Validate exact source without APK generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk app/build/outputs/bundle
          gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug
          test ! -d app/build/outputs/apk || test -z "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test ! -d app/build/outputs/bundle || test -z "$(find app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          git diff --exit-code -- app/schemas
          echo "PASS: exact source compile/tests/lint; Room schema clean; no APK/AAB generated."
