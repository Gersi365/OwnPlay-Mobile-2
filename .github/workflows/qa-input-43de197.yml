name: QA input v34 for e54e08d

on:
  push:
    branches:
      - qa-apk-43de197
    paths:
      - '.github/workflows/qa-input-43de197.yml'

permissions:
  contents: read

jobs:
  build-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e54e08d4d0c675075bb3849689adadb1c2b2bb94
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "e54e08d4d0c675075bb3849689adadb1c2b2bb94"
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
          validate-wrappers: true
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-build-cache --stacktrace
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p qa-input
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" qa-input/OwnPlay-Mobile-2-exact-source-e54e08d.apk
          sha256sum qa-input/OwnPlay-Mobile-2-exact-source-e54e08d.apk > qa-input/SHA256.txt
      - name: Upload build input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OwnPlay-Mobile-2-exact-source-e54e08d
          path: qa-input/
          if-no-files-found: error
          retention-days: 7
