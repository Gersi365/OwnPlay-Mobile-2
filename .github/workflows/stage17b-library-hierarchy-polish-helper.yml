name: Stage 17B Library hierarchy polish helper

on:
  push:
    branches:
      - stage-17b-library-hierarchy-polish-helper
    paths:
      - .github/workflows/stage17b-library-hierarchy-polish-helper.yml

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 3b9024e9df7a6d92f9595b72cd1d52f7fe32995d
      TARGET_BRANCH: stage-17b-library-hierarchy-polish

    steps:
      - name: Checkout exact Stage 17A source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply deterministic Library hierarchy polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import subprocess

          actions = Path("app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryActions.kt")
          shell = Path("app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt")

          def replace_exact(path, old, new, expected=1):
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {count}: {old!r}")
              path.write_text(text.replace(old, new))

          replace_exact(
              actions,
              'import androidx.compose.foundation.BorderStroke\n',
              'import androidx.compose.animation.animateColorAsState\nimport androidx.compose.foundation.BorderStroke\n',
          )
          replace_exact(
              actions,
              'import androidx.compose.foundation.clickable\n',
              'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.interaction.MutableInteractionSource\nimport androidx.compose.foundation.interaction.collectIsPressedAsState\n',
          )
          replace_exact(
              actions,
              'import androidx.compose.runtime.Composable\n',
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.remember\n',
          )

          old_action_button = dedent('''\
          @Composable
          private fun LibraryActionButton(
              text: String,
              onClick: () -> Unit,
              modifier: Modifier,
              primary: Boolean,
              glyph: LibraryActionGlyph?,
          ) {
              val contentColor = if (primary) Color.White else OwnPlayColors.TextSecondary
              Box(
                  modifier = modifier
                      .height(48.dp)
                      .clickable(role = Role.Button, onClick = onClick)
                      .semantics(mergeDescendants = true) {},
                  contentAlignment = Alignment.Center,
              ) {
                  Surface(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(40.dp),
                      shape = OwnPlayShapeTokens.Small,
                      color = if (primary) OwnPlayColors.AccentStrong else Color.Transparent,
                      border = null,
                      tonalElevation = 0.dp,
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(40.dp)
                              .padding(horizontal = if (primary) 14.dp else 8.dp),
                          horizontalArrangement = Arrangement.Center,
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          glyph?.let {
                              Text(
                                  text = it.symbol,
                                  modifier = Modifier.clearAndSetSemantics {},
                                  style = MaterialTheme.typography.labelMedium,
                                  color = contentColor,
                                  fontWeight = FontWeight.Bold,
                              )
                              Spacer(modifier = Modifier.width(7.dp))
                          }
                          Text(
                              text = text,
                              style = MaterialTheme.typography.labelLarge,
                              color = contentColor,
                              fontWeight = if (primary) FontWeight.SemiBold else FontWeight.Medium,
                              maxLines = 1,
                          )
                      }
                  }
              }
          }
          ''')
          new_action_button = dedent('''\
          @Composable
          private fun LibraryActionButton(
              text: String,
              onClick: () -> Unit,
              modifier: Modifier,
              primary: Boolean,
              glyph: LibraryActionGlyph?,
          ) {
              val interactionSource = remember { MutableInteractionSource() }
              val isPressed by interactionSource.collectIsPressedAsState()
              val contentColor = if (primary) Color.White else OwnPlayColors.TextSecondary
              val containerColor by animateColorAsState(
                  targetValue = when {
                      primary && isPressed -> OwnPlayColors.Accent
                      primary -> OwnPlayColors.AccentStrong
                      isPressed -> OwnPlayColors.SurfaceElevated.copy(alpha = 0.72f)
                      else -> Color.Transparent
                  },
                  label = "libraryActionContainer",
              )
              Box(
                  modifier = modifier
                      .height(48.dp)
                      .clickable(
                          interactionSource = interactionSource,
                          indication = null,
                          role = Role.Button,
                          onClick = onClick,
                      )
                      .semantics(mergeDescendants = true) {},
                  contentAlignment = Alignment.Center,
              ) {
                  Surface(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(40.dp),
                      shape = OwnPlayShapeTokens.Small,
                      color = containerColor,
