                                  1f to Color.Black.copy(alpha = 0.94f),
                              ),
                          ),
                  )
                  if (isPressed) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.Black.copy(alpha = 0.12f)),
                      )
                  }
                  Column(
                      modifier = Modifier
                          .align(Alignment.BottomStart)
                          .padding(horizontal = 10.dp, vertical = 9.dp),
                      verticalArrangement = Arrangement.spacedBy(2.dp),
                  ) {
                      Text(
                          text = eyebrow,
                          style = MaterialTheme.typography.labelSmall,
                          color = OwnPlayColors.Accent.copy(alpha = 0.88f),
                          fontWeight = FontWeight.Medium,
                          maxLines = 1,
                      )
                      Text(
                          text = title,
                          style = MaterialTheme.typography.labelLarge,
                          color = Color.White,
                          fontWeight = FontWeight.SemiBold,
                          maxLines = 2,
                      )
                  }
              }
          }
          ''')
          replace_exact(shell, old_poster, new_poster)

          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {str(actions), str(shell)}
          if actual != expected:
              raise SystemExit(f"Unexpected changed files: {actual}; expected {expected}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Validate source only
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:testDebugUnitTest :app:lintDebug
          test -z "$(find . -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryActions.kt \
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt | sort)"
          test "$changed" = "$expected"

      - name: Commit validated Library hierarchy polish to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add \
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryActions.kt \
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt
          git commit -m "Polish Library hierarchy and interaction states"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
