name: Stage 22 library playback helper

on:
  push:
    branches:
      - stage22-library-playback-helper

permissions:
  contents: write

concurrency:
  group: stage22-library-playback-helper
  cancel-in-progress: false

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: stage22-library-playback-helper
          fetch-depth: 0

      - name: Preserve patch helper and checkout exact target base
        shell: bash
        run: |
          cp .github/helpers/stage22_patch.py /tmp/stage22_patch.py
          git fetch origin stage-22-library-playback-compatibility
          git checkout -B stage-22-library-playback-compatibility origin/stage-22-library-playback-compatibility
          actual="$(git rev-parse HEAD)"
          expected="f33d06003e0aaac5cc18cab96a0c7e3cd9729a3d"
          test "$actual" = "$expected"
          echo "Exact Stage 21 base verified: $actual"

      - name: Apply bounded playback compatibility patch
        shell: bash
        run: python /tmp/stage22_patch.py

      - name: Guard Stage 22 source scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            app/src/main/java/app/ownplay/mobile/feature/library/data/LibraryPlaybackLocator.kt
            app/src/main/java/app/ownplay/mobile/feature/library/data/LibraryRepositoryImpl.kt
            app/src/main/java/app/ownplay/mobile/feature/library/domain/LibraryModels.kt
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt
            app/src/main/java/app/ownplay/mobile/playback/Media3PlaybackController.kt
            app/src/test/java/app/ownplay/mobile/feature/library/data/LibraryPlaybackLocatorTest.kt
            docs/audit/STAGE22_LIBRARY_PLAYBACK_COMPATIBILITY_SOURCE_AUDIT.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate source without APK generation
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Commit and push validated Stage 22 source
        shell: bash
        run: |
          git config user.name "OwnPlay QA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/java/app/ownplay/mobile/feature/library/data/LibraryPlaybackLocator.kt \
            app/src/main/java/app/ownplay/mobile/feature/library/data/LibraryRepositoryImpl.kt \
            app/src/main/java/app/ownplay/mobile/feature/library/domain/LibraryModels.kt \
            app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt \
            app/src/main/java/app/ownplay/mobile/playback/Media3PlaybackController.kt \
            app/src/test/java/app/ownplay/mobile/feature/library/data/LibraryPlaybackLocatorTest.kt \
            docs/audit/STAGE22_LIBRARY_PLAYBACK_COMPATIBILITY_SOURCE_AUDIT.md
          git commit -m "Harden Library playback compatibility"
          git push origin HEAD:stage-22-library-playback-compatibility
          echo "Validated Stage 22 commit: $(git rev-parse HEAD)"
