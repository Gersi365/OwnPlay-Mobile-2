name: Stage 14 Library action refinement source patch

on:
  push:
    branches:
      - stage14-library-actions-helper

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 4c2494b233b8718df30e60f630a3236cef51d24b
      TARGET_BRANCH: stage-14-library-action-refinement

    steps:
      - name: Checkout helper scripts
        uses: actions/checkout@v4
        with:
          ref: stage14-library-actions-helper
          path: helper
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Stage 13 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: source
          fetch-depth: 1

      - name: Verify exact source and target branch absence
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Apply Library-only action refinement
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 ../helper/.github/stage14_library_actions_patch.py
          test -f app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryActions.kt
          test -f docs/audit/STAGE14_LIBRARY_ACTION_SOURCE_AUDIT.md
          test "$(git diff --name-only)" = "app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt"
          test "$(git ls-files --others --exclude-standard | sort)" = "$(printf '%s\n' app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryActions.kt docs/audit/STAGE14_LIBRARY_ACTION_SOURCE_AUDIT.md | sort)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true

      - name: Validate patched source without APK generation
        shell: bash
        run: |
          set -euo pipefail
          cd source
          bash tools/validate-source-no-apk.sh

      - name: Verify no APK or AAB was generated
        shell: bash
        run: |
          set -euo pipefail
          cd source
          if find . -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo "Unexpected APK/AAB generated during source-only Stage 14 validation."
            exit 1
          fi

      - name: Commit and push isolated Stage 14 branch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git checkout -b "$TARGET_BRANCH"
          git add app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryActions.kt
          git add app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt
          git add docs/audit/STAGE14_LIBRARY_ACTION_SOURCE_AUDIT.md
          git commit -m "Refine Library action hierarchy"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
