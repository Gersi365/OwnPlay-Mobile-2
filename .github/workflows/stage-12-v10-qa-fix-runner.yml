private fun settleReorderOffset(state: ReorderVisualState, itemGapPx: Float, onMove: (Int) -> Boolean) {
    val moveDistance = (state.itemHeightPx + itemGapPx).coerceAtLeast(1f)
    while (state.offsetY >= moveDistance) {
        if (onMove(1)) state.offsetY -= moveDistance else { state.offsetY = moveDistance * 0.35f; break }
    }
    while (state.offsetY <= -moveDistance) {
        if (onMove(-1)) state.offsetY += moveDistance else { state.offsetY = -moveDistance * 0.35f; break }
    }
}
