          if t.count(marker)!=1: raise SystemExit('DragHandle marker')
          prefix=t.split(marker,1)[0]
          t=prefix+'''@Composable
private fun DragHandle(
    itemKey: String,
    contentDescription: String,
    enabled: Boolean,
    state: ReorderVisualState,
    listState: LazyListState,
    onMove: (Int) -> Boolean,
) {
    val density = LocalDensity.current
    val itemGapPx = with(density) { OwnPlaySpacing.Sm.toPx() }
    val edgeZonePx = with(density) { 72.dp.toPx() }
    val maxAutoScrollStepPx = with(density) { 12.dp.toPx() }
    val haptic = LocalHapticFeedback.current

    LaunchedEffect(state.dragging, state.autoScrollStepPx, listState) {
        while (state.dragging && state.autoScrollStepPx != 0f) {
            val consumed = listState.scrollBy(state.autoScrollStepPx)
            if (consumed == 0f) { state.autoScrollStepPx = 0f; break }
            state.offsetY += consumed
            settleReorderOffset(state, itemGapPx, onMove)
            delay(16)
        }
    }

    fun updateEdgeAutoScroll() {
        if (!state.dragging) { state.autoScrollStepPx = 0f; return }
        val layout = listState.layoutInfo
        val item = layout.visibleItemsInfo.firstOrNull { it.key == itemKey }
        if (item == null) { state.autoScrollStepPx = 0f; return }
        val centerY = item.offset + item.size / 2f + state.offsetY
        val topEdge = layout.viewportStartOffset + edgeZonePx
        val bottomEdge = layout.viewportEndOffset - edgeZonePx
        state.autoScrollStepPx = when {
            centerY < topEdge -> -maxAutoScrollStepPx * ((topEdge - centerY) / edgeZonePx).coerceIn(0.2f, 1f)
            centerY > bottomEdge -> maxAutoScrollStepPx * ((centerY - bottomEdge) / edgeZonePx).coerceIn(0.2f, 1f)
            else -> 0f
        }
    }

    val dragModifier = if (enabled) Modifier.pointerInput(itemKey, enabled) {
        detectDragGesturesAfterLongPress(
            onDragStart = { state.offsetY = 0f; state.autoScrollStepPx = 0f; state.dragging = true; haptic.performHapticFeedback(HapticFeedbackType.LongPress) },
            onDragCancel = { state.offsetY = 0f; state.autoScrollStepPx = 0f; state.dragging = false },
            onDragEnd = { state.offsetY = 0f; state.autoScrollStepPx = 0f; state.dragging = false },
            onDrag = { change, dragAmount ->
                change.consume()
                state.offsetY += dragAmount.y
                settleReorderOffset(state, itemGapPx, onMove)
                updateEdgeAutoScroll()
            },
        )
    } else Modifier

    Box(
        modifier = Modifier.size(44.dp).background(if (state.dragging) OwnPlayColors.AccentSoft else OwnPlayColors.SurfaceElevated, RoundedCornerShape(10.dp)).semantics { this.contentDescription = contentDescription }.then(dragModifier),
        contentAlignment = Alignment.Center,
    ) { DragGripDots(active = state.dragging, enabled = enabled) }
}

@Composable
private fun DragGripDots(active: Boolean, enabled: Boolean) {
    val dotColor = when { active -> OwnPlayColors.Accent; enabled -> OwnPlayColors.TextPrimary; else -> OwnPlayColors.TextSecondary }
    Canvas(modifier = Modifier.size(22.dp)) {
        val radius = 1.7.dp.toPx()
        val xs = listOf(size.width * 0.36f, size.width * 0.64f)
        val ys = listOf(size.height * 0.28f, size.height * 0.50f, size.height * 0.72f)
        ys.forEach { y -> xs.forEach { x -> drawCircle(color = dotColor, radius = radius, center = Offset(x, y)) } }
    }
}
