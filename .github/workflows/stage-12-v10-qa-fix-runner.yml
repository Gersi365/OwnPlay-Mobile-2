name: Stage 12 QA v10 source-fix runner

on:
  push:
    branches:
      - stage-12-v10-qa-fix-runner

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: f8fa35c5d6720896747f60364b4330d1b8749063
      TARGET_BRANCH: stage-12-v10-qa-fix-candidate
    steps:
      - name: Checkout runner assets
        uses: actions/checkout@v4
        with:
          path: runner
          fetch-depth: 1

      - name: Checkout exact audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1

      - name: Verify exact audited source
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply focused QA corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 runner/tools/stage12_v10_patch.py source
          cd source
          git diff --check
          test "$(git diff --name-only | sort)" = $'app/src/main/java/app/ownplay/mobile/MainActivity.kt\napp/src/main/java/app/ownplay/mobile/feature/settings/ui/LiveManagementScreen.kt'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Validate source without APK
        shell: bash
        working-directory: source
        run: bash tools/validate-source-no-apk.sh

      - name: Commit validated source correction
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java/app/ownplay/mobile/MainActivity.kt \
                  app/src/main/java/app/ownplay/mobile/feature/settings/ui/LiveManagementScreen.kt
          git commit -m "Fix edit drag scrolling and fullscreen exit"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
