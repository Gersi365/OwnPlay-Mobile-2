name: Stage 30 QA signing tool

on:
  push:
    branches:
      - stage-30-qa-build-v26

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ./apksigner.jar

      - name: Upload signing tool jar
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36-apksigner-jar
          path: apksigner.jar
          if-no-files-found: error
          retention-days: 1
