name: Stage 17D offline polish helper v2

on:
  push:
    branches:
      - stage17d-offline-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 39d690caaa7880592a266f405d8044c3a3fc88a5
      TARGET_BRANCH: stage-17d-library-offline-polish
    steps:
      - name: Checkout exact Stage 17C base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Verify exact base
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply bounded Library offline visual patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/stage17d_patch.py
          python3 /tmp/stage17d_patch.py

      - name: Guard exact source scope
        shell: bash
        run: |
          mapfile -t changed < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryOfflineControls.kt'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true

      - name: Validate source without APK generation
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Commit and push Stage 17D source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"
          git add app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt \
                  app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryOfflineControls.kt
          git commit -m "Polish downloaded media hierarchy"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
