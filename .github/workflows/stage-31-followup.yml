name: Stage 31 zapping hardening helper

on:
  push:
    branches:
      - stage-31-live-gesture-navigation

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Add temporary Stage 31 zapping hardening helper'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clear stale fallback before resolving a new channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt')
          text = p.read_text()
          old = '''                scope.launch {\n                    resolutionError = null\n                    when (val resolved = liveRepository.resolvePlayback(effect.channelId)) {\n'''
          new = '''                scope.launch {\n                    resolutionError = null\n                    fallbackLoadRequest = null\n                    when (val resolved = liveRepository.resolvePlayback(effect.channelId)) {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one load-start block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt
          git commit -m "Harden rapid Live channel switching"
          git push origin HEAD:stage-31-live-gesture-navigation
