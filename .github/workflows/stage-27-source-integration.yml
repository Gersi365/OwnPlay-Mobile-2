name: Stage 27 source integration

on:
  push:
    branches:
      - stage-27-live-custom-groups
    paths:
      - .github/workflows/stage-27-source-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-27-live-custom-groups
          fetch-depth: 0
      - name: Apply deterministic integration script
        run: python3 tools/stage27_integration.py
      - name: Commit source integration
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main/java/app/ownplay/mobile/feature/live/data/LiveRepositoryImpl.kt
          git add app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt
          git add app/src/main/java/app/ownplay/mobile/feature/settings/ui/LiveManagementScreen.kt
          git diff --cached --quiet && { echo "No integration changes produced"; exit 1; }
          git commit -m "Stage 27: integrate Live custom groups"
          git push origin HEAD:stage-27-live-custom-groups
