name: Stage 31 integration helper

on:
  push:
    branches:
      - stage-31-live-gesture-navigation

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Add temporary Stage 31 integration workflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact Stage 30 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2eabf3ff9402899261133e9da5336e92f7af3f32"

      - name: Apply Stage 31 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          main = "app/src/main/java/app/ownplay/mobile/MainActivity.kt"
          replace_once(
              main,
              """        requestedOrientation = if (fullscreen) {\n            ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE\n        } else {\n            ActivityInfo.SCREEN_ORIENTATION_PORTRAIT\n        }\n""",
              """        requestedOrientation = if (fullscreen) {\n            ActivityInfo.SCREEN_ORIENTATION_FULL_SENSOR\n        } else {\n            ActivityInfo.SCREEN_ORIENTATION_PORTRAIT\n        }\n""",
          )

          orientation = "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveOrientationPolicy.kt"
          replace_once(
              orientation,
              """    fun shouldAutoEnterFullscreen(orientationDegrees: Int, armed: Boolean): Boolean =\n        armed && isLandscape(orientationDegrees)\n""",
              """    fun shouldAutoEnterFullscreen(orientationDegrees: Int, armed: Boolean): Boolean =\n        armed && isLandscape(orientationDegrees)\n\n    fun shouldAutoExitFullscreen(\n        previousOrientationDegrees: Int?,\n        orientationDegrees: Int,\n    ): Boolean = previousOrientationDegrees?.let(::isLandscape) == true && isPortrait(orientationDegrees)\n""",
          )

          reducer = "app/src/main/java/app/ownplay/mobile/feature/live/domain/LivePresentationReducer.kt"
          replace_once(
              reducer,
              """sealed interface LiveIntent {\n    data class ChannelTapped(val channelId: String) : LiveIntent\n    data object BackPressed : LiveIntent\n""",
              """sealed interface LiveIntent {\n    data class ChannelTapped(val channelId: String) : LiveIntent\n    data class ChannelSwitched(val channelId: String) : LiveIntent\n    data object BackPressed : LiveIntent\n""",
          )
          replace_once(
              reducer,
              """    ): LiveTransition = when (intent) {\n        is LiveIntent.ChannelTapped -> onChannelTapped(state, intent.channelId)\n        LiveIntent.BackPressed -> onBackPressed(state)\n""",
              """    ): LiveTransition = when (intent) {\n        is LiveIntent.ChannelTapped -> onChannelTapped(state, intent.channelId)\n        is LiveIntent.ChannelSwitched -> onChannelSwitched(state, intent.channelId)\n        LiveIntent.BackPressed -> onBackPressed(state)\n""",
          )
          replace_once(
              reducer,
              """    private fun onBackPressed(state: LivePresentationState): LiveTransition = when (state.presentation) {\n""",
              """    private fun onChannelSwitched(\n        state: LivePresentationState,\n        channelId: String,\n    ): LiveTransition {\n        require(channelId.isNotBlank()) { \"Channel id must not be blank.\" }\n\n        if (state.presentation == LivePresentation.BROWSE || state.selectedChannelId == channelId) {\n            return LiveTransition(state = state)\n        }\n\n        return LiveTransition(\n            state = state.copy(selectedChannelId = channelId),\n            effects = listOf(LiveEffect.LoadChannel(channelId)),\n        )\n    }\n\n    private fun onBackPressed(state: LivePresentationState): LiveTransition = when (state.presentation) {\n""",
          )

          gesture_path = Path("app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveGestureNavigation.kt")
          if gesture_path.exists():
              raise SystemExit(f"{gesture_path}: already exists")
          gesture_path.write_text('''package app.ownplay.mobile.feature.live.ui\n\nimport androidx.compose.foundation.gestures.detectHorizontalDragGestures\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.input.pointer.pointerInput\nimport androidx.compose.ui.unit.dp\n\ninternal enum class LiveNavigationDirection {\n    PREVIOUS,\n    NEXT,\n}\n\ninternal object LiveGestureNavigationPolicy {\n    fun directionForHorizontalSwipe(\n        totalDragX: Float,\n        minDistancePx: Float,\n    ): LiveNavigationDirection? {\n        require(minDistancePx > 0f) { \"Minimum swipe distance must be positive.\" }\n        return when {\n            totalDragX <= -minDistancePx -> LiveNavigationDirection.NEXT\n            totalDragX >= minDistancePx -> LiveNavigationDirection.PREVIOUS\n            else -> null\n        }\n    }\n\n    fun adjacentKey(\n        keys: List<String>,\n        currentKey: String?,\n        direction: LiveNavigationDirection,\n    ): String? {\n        val navigationKeys = keys.distinct()\n        if (navigationKeys.size < 2) return null\n\n        val currentIndex = navigationKeys.indexOf(currentKey)\n        if (currentIndex < 0) {\n            return when (direction) {\n                LiveNavigationDirection.PREVIOUS -> navigationKeys.last()\n                LiveNavigationDirection.NEXT -> navigationKeys.first()\n            }\n        }\n\n        val nextIndex = when (direction) {\n            LiveNavigationDirection.PREVIOUS ->\n                (currentIndex - 1 + navigationKeys.size) % navigationKeys.size\n            LiveNavigationDirection.NEXT ->\n                (currentIndex + 1) % navigationKeys.size\n        }\n        return navigationKeys[nextIndex]\n    }\n}\n\ninternal fun Modifier.liveHorizontalNavigationGestures(\n    enabled: Boolean,\n    onPrevious: () -> Unit,\n    onNext: () -> Unit,\n): Modifier = if (!enabled) {\n    this\n} else {\n    pointerInput(enabled, onPrevious, onNext) {\n        var totalDragX = 0f\n        val minDistancePx = 56.dp.toPx()\n\n        detectHorizontalDragGestures(\n            onDragStart = { totalDragX = 0f },\n            onDragCancel = { totalDragX = 0f },\n            onDragEnd = {\n                when (\n                    LiveGestureNavigationPolicy.directionForHorizontalSwipe(\n                        totalDragX = totalDragX,\n                        minDistancePx = minDistancePx,\n                    )\n                ) {\n                    LiveNavigationDirection.PREVIOUS -> onPrevious()\n                    LiveNavigationDirection.NEXT -> onNext()\n                    null -> Unit\n                }\n                totalDragX = 0f\n            },\n            onHorizontalDrag = { change, dragAmount ->\n                totalDragX += dragAmount\n                change.consume()\n            },\n        )\n    }\n}\n''')

          shell = "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt"
          replace_once(
              shell,
              """import java.time.format.DateTimeFormatter\nimport kotlinx.coroutines.CoroutineScope\n""",
              """import java.time.format.DateTimeFormatter\nimport java.util.concurrent.atomic.AtomicLong\nimport kotlinx.coroutines.CoroutineScope\n""",
          )
          replace_once(
              shell,
              """    val scope = rememberCoroutineScope()\n    val browseListState = rememberLazyListState()\n\n    var presentationState by remember { mutableStateOf(LivePresentationState()) }\n""",
              """    val scope = rememberCoroutineScope()\n    val browseListState = rememberLazyListState()\n    val channelLoadGeneration = remember { AtomicLong(0L) }\n\n    var presentationState by remember { mutableStateOf(LivePresentationState()) }\n""",
          )
          replace_once(
              shell,
              """    var orientationFullscreenArmed by remember { mutableStateOf(true) }\n    var searchVisible by remember(catalog?.activeSourceId) { mutableStateOf(false) }\n""",
              """    var orientationFullscreenArmed by remember { mutableStateOf(true) }\n    var lastStableOrientationDegrees by remember { mutableStateOf<Int?>(null) }\n    var searchVisible by remember(catalog?.activeSourceId) { mutableStateOf(false) }\n""",
          )
          replace_once(
              shell,
              """        when (effect) {\n            is LiveEffect.LoadChannel -> scope.launch {\n                resolutionError = null\n                when (val resolved = liveRepository.resolvePlayback(effect.channelId)) {\n                    is LivePlaybackResolution.Success -> {\n                        fallbackLoadRequest = resolved.value.fallbackUri?.let { fallbackUri ->\n                            PlaybackLoadRequest(\n                                media = PlaybackMedia(\n                                    id = resolved.value.channel.channelId,\n                                    uri = fallbackUri,\n                                    title = resolved.value.channel.name,\n                                    kind = PlaybackKind.LIVE,\n                                    streamFormat = resolved.value.fallbackStreamFormat ?: resolved.value.streamFormat,\n                                ),\n                            )\n                        }\n                        playbackController.load(\n                            PlaybackLoadRequest(\n                                media = PlaybackMedia(\n                                    id = resolved.value.channel.channelId,\n                                    uri = resolved.value.uri,\n                                    title = resolved.value.channel.name,\n                                    kind = PlaybackKind.LIVE,\n                                    streamFormat = resolved.value.streamFormat,\n                                ),\n                            ),\n                        )\n                    }\n\n                    is LivePlaybackResolution.Failure -> {\n                        fallbackLoadRequest = null\n                        playbackController.stop(clearMedia = true)\n                        resolutionError = resolved.safeMessage\n                    }\n                }\n            }\n\n            LiveEffect.StopPlayback -> scope.launch {\n                resolutionError = null\n                fallbackLoadRequest = null\n                playbackController.stop(clearMedia = true)\n            }\n        }\n""",
              """        when (effect) {\n            is LiveEffect.LoadChannel -> {\n                val generation = channelLoadGeneration.incrementAndGet()\n                scope.launch {\n                    resolutionError = null\n                    when (val resolved = liveRepository.resolvePlayback(effect.channelId)) {\n                        is LivePlaybackResolution.Success -> {\n                            if (\n                                channelLoadGeneration.get() != generation ||\n                                presentationState.selectedChannelId != effect.channelId\n                            ) {\n                                return@launch\n                            }\n                            fallbackLoadRequest = resolved.value.fallbackUri?.let { fallbackUri ->\n                                PlaybackLoadRequest(\n                                    media = PlaybackMedia(\n                                        id = resolved.value.channel.channelId,\n                                        uri = fallbackUri,\n                                        title = resolved.value.channel.name,\n                                        kind = PlaybackKind.LIVE,\n                                        streamFormat = resolved.value.fallbackStreamFormat ?: resolved.value.streamFormat,\n                                    ),\n                                )\n                            }\n                            playbackController.load(\n                                PlaybackLoadRequest(\n                                    media = PlaybackMedia(\n                                        id = resolved.value.channel.channelId,\n                                        uri = resolved.value.uri,\n                                        title = resolved.value.channel.name,\n                                        kind = PlaybackKind.LIVE,\n                                        streamFormat = resolved.value.streamFormat,\n                                    ),\n                                ),\n                            )\n                        }\n\n                        is LivePlaybackResolution.Failure -> {\n                            if (\n                                channelLoadGeneration.get() != generation ||\n                                presentationState.selectedChannelId != effect.channelId\n                            ) {\n                                return@launch\n                            }\n                            fallbackLoadRequest = null\n                            playbackController.stop(clearMedia = true)\n                            resolutionError = resolved.safeMessage\n                        }\n                    }\n                }\n            }\n\n            LiveEffect.StopPlayback -> {\n                channelLoadGeneration.incrementAndGet()\n                scope.launch {\n                    resolutionError = null\n                    fallbackLoadRequest = null\n                    playbackController.stop(clearMedia = true)\n                }\n            }\n        }\n""",
          )
          replace_once(
              shell,
              """    LaunchedEffect(favoriteChannels.isEmpty(), favoritesOnly) {\n""",
              """    fun selectProviderCategory(categoryKey: String?) {\n        favoritesOnly = false\n        selectedCustomGroupId = null\n        selectedCategoryKey = categoryKey\n        if (\n            presentationState.presentation == LivePresentation.PREVIEW &&\n            selectedChannel?.categoryKey != categoryKey\n        ) {\n            dispatch(LiveIntent.BackPressed)\n        }\n    }\n\n    fun stepProviderCategory(direction: LiveNavigationDirection) {\n        if (searchActive || favoritesOnly || selectedCustomGroup != null) return\n        val nextCategoryKey = LiveGestureNavigationPolicy.adjacentKey(\n            keys = categories.map { it.categoryKey },\n            currentKey = activeCategoryKey,\n            direction = direction,\n        ) ?: return\n        selectProviderCategory(nextCategoryKey)\n    }\n\n    fun stepFullscreenChannel(direction: LiveNavigationDirection) {\n        val currentChannelId = presentationState.selectedChannelId ?: return\n        val nextChannelId = LiveGestureNavigationPolicy.adjacentKey(\n            keys = visibleChannels.map { it.channelId },\n            currentKey = currentChannelId,\n            direction = direction,\n        ) ?: return\n        dispatch(LiveIntent.ChannelSwitched(nextChannelId))\n    }\n\n    LaunchedEffect(favoriteChannels.isEmpty(), favoritesOnly) {\n""",
          )
          old_orientation_effect = '''    val orientationContext = LocalContext.current\n    DisposableEffect(\n        orientationContext,\n        presentationState.presentation,\n        presentationState.selectedChannelId,\n    ) {\n        val selectedId = presentationState.selectedChannelId\n        if (presentationState.presentation != LivePresentation.PREVIEW || selectedId == null) {\n            onDispose { }\n        } else {\n            var landscapeTriggered = false\n            val listener = object : OrientationEventListener(orientationContext) {\n                override fun onOrientationChanged(orientation: Int) {\n                    if (orientation == ORIENTATION_UNKNOWN) return\n                    when {\n                        LiveOrientationPolicy.isPortrait(orientation) -> {\n                            landscapeTriggered = false\n                            orientationFullscreenArmed = true\n                        }\n                        LiveOrientationPolicy.shouldAutoEnterFullscreen(\n                            orientationDegrees = orientation,\n                            armed = orientationFullscreenArmed,\n                        ) && !landscapeTriggered -> {\n                            landscapeTriggered = true\n                            orientationFullscreenArmed = false\n                            dispatch(LiveIntent.ChannelTapped(selectedId))\n                        }\n                    }\n                }\n            }\n            if (listener.canDetectOrientation()) listener.enable()\n            onDispose { listener.disable() }\n        }\n    }\n'''
          new_orientation_effect = '''    val orientationContext = LocalContext.current\n    DisposableEffect(\n        orientationContext,\n        presentationState.presentation,\n        presentationState.selectedChannelId,\n    ) {\n        val selectedId = presentationState.selectedChannelId\n        if (presentationState.presentation == LivePresentation.BROWSE || selectedId == null) {\n            onDispose { }\n        } else {\n            var landscapeTriggered = false\n            var portraitExitTriggered = false\n            val listener = object : OrientationEventListener(orientationContext) {\n                override fun onOrientationChanged(orientation: Int) {\n                    if (orientation == ORIENTATION_UNKNOWN) return\n                    val previousStableOrientation = lastStableOrientationDegrees\n                    when {\n                        LiveOrientationPolicy.isPortrait(orientation) -> {\n                            lastStableOrientationDegrees = orientation\n                            landscapeTriggered = false\n                            orientationFullscreenArmed = true\n                            if (\n                                presentationState.presentation == LivePresentation.FULLSCREEN &&\n                                LiveOrientationPolicy.shouldAutoExitFullscreen(\n                                    previousOrientationDegrees = previousStableOrientation,\n                                    orientationDegrees = orientation,\n                                ) &&\n                                !portraitExitTriggered\n                            ) {\n                                portraitExitTriggered = true\n                                dispatch(LiveIntent.BackPressed)\n                            }\n                        }\n                        LiveOrientationPolicy.isLandscape(orientation) -> {\n                            lastStableOrientationDegrees = orientation\n                            if (\n                                presentationState.presentation == LivePresentation.PREVIEW &&\n                                LiveOrientationPolicy.shouldAutoEnterFullscreen(\n                                    orientationDegrees = orientation,\n                                    armed = orientationFullscreenArmed,\n                                ) &&\n                                !landscapeTriggered\n                            ) {\n                                landscapeTriggered = true\n                                orientationFullscreenArmed = false\n                                dispatch(LiveIntent.ChannelTapped(selectedId))\n                            }\n                        }\n                    }\n                }\n            }\n            if (listener.canDetectOrientation()) listener.enable()\n            onDispose { listener.disable() }\n        }\n    }\n'''
          replace_once(shell, old_orientation_effect, new_orientation_effect)

          replace_once(
              shell,
              """            onBackToPreview = {\n                orientationFullscreenArmed = false\n                dispatch(LiveIntent.BackPressed)\n            },\n            modifier = modifier,\n""",
              """            onBackToPreview = {\n                orientationFullscreenArmed = false\n                dispatch(LiveIntent.BackPressed)\n            },\n            onPreviousChannel = { stepFullscreenChannel(LiveNavigationDirection.PREVIOUS) },\n            onNextChannel = { stepFullscreenChannel(LiveNavigationDirection.NEXT) },\n            modifier = modifier,\n""",
          )
          replace_once(
              shell,
              """            showCategories = showCategories,\n            onSearchToggle = {\n""",
              """            showCategories = showCategories,\n            categorySwipeEnabled = !searchActive && !favoritesOnly && selectedCustomGroup == null && categories.size > 1,\n            onPreviousCategoryGesture = { stepProviderCategory(LiveNavigationDirection.PREVIOUS) },\n            onNextCategoryGesture = { stepProviderCategory(LiveNavigationDirection.NEXT) },\n            onSearchToggle = {\n""",
          )
          replace_once(
              shell,
              """            onCategorySelected = { categoryKey ->\n                favoritesOnly = false\n                selectedCustomGroupId = null\n                selectedCategoryKey = categoryKey\n                if (\n                    presentationState.presentation == LivePresentation.PREVIEW &&\n                    selectedChannel?.categoryKey != categoryKey\n                ) {\n                    dispatch(LiveIntent.BackPressed)\n                }\n            },\n""",
              """            onCategorySelected = ::selectProviderCategory,\n""",
          )
          replace_once(
              shell,
              """    showCategories: Boolean,\n    onSearchToggle: () -> Unit,\n""",
              """    showCategories: Boolean,\n    categorySwipeEnabled: Boolean,\n    onPreviousCategoryGesture: () -> Unit,\n    onNextCategoryGesture: () -> Unit,\n    onSearchToggle: () -> Unit,\n""",
          )
          replace_once(
              shell,
              """                    Box(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .padding(horizontal = OwnPlaySpacing.Lg, vertical = 3.dp),\n                    ) {\n""",
              """                    Box(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .liveHorizontalNavigationGestures(\n                                enabled = categorySwipeEnabled,\n                                onPrevious = onPreviousCategoryGesture,\n                                onNext = onNextCategoryGesture,\n                            )\n                            .padding(horizontal = OwnPlaySpacing.Lg, vertical = 3.dp),\n                    ) {\n""",
          )
          replace_once(
              shell,
              """    audioTracks: List<PlaybackAudioTrack>,\n    onBackToPreview: () -> Unit,\n    modifier: Modifier = Modifier,\n""",
              """    audioTracks: List<PlaybackAudioTrack>,\n    onBackToPreview: () -> Unit,\n    onPreviousChannel: () -> Unit,\n    onNextChannel: () -> Unit,\n    modifier: Modifier = Modifier,\n""",
          )
          replace_once(
              shell,
              """        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .playerLocalVerticalControls(playbackController, controllerScope)\n                .clickable(\n""",
              """        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .playerLocalVerticalControls(playbackController, controllerScope)\n                .liveHorizontalNavigationGestures(\n                    enabled = !optionsVisible,\n                    onPrevious = {\n                        optionsVisible = false\n                        overlayVisible = true\n                        onPreviousChannel()\n                    },\n                    onNext = {\n                        optionsVisible = false\n                        overlayVisible = true\n                        onNextChannel()\n                    },\n                )\n                .clickable(\n""",
          )

          orientation_test = "app/src/test/java/app/ownplay/mobile/feature/live/ui/LiveOrientationPolicyTest.kt"
          replace_once(
              orientation_test,
              """    @Test\n    fun `manual fullscreen exit stays in preview until portrait rearms orientation entry`() {\n        assertTrue(LiveOrientationPolicy.shouldAutoEnterFullscreen(90, armed = true))\n        assertFalse(LiveOrientationPolicy.shouldAutoEnterFullscreen(90, armed = false))\n        assertFalse(LiveOrientationPolicy.shouldAutoEnterFullscreen(0, armed = true))\n    }\n""",
              """    @Test\n    fun `manual fullscreen exit stays in preview until portrait rearms orientation entry`() {\n        assertTrue(LiveOrientationPolicy.shouldAutoEnterFullscreen(90, armed = true))\n        assertFalse(LiveOrientationPolicy.shouldAutoEnterFullscreen(90, armed = false))\n        assertFalse(LiveOrientationPolicy.shouldAutoEnterFullscreen(0, armed = true))\n    }\n\n    @Test\n    fun `fullscreen exits only when physical orientation transitions from landscape to portrait`() {\n        assertTrue(LiveOrientationPolicy.shouldAutoExitFullscreen(90, 0))\n        assertTrue(LiveOrientationPolicy.shouldAutoExitFullscreen(270, 180))\n        assertFalse(LiveOrientationPolicy.shouldAutoExitFullscreen(0, 0))\n        assertFalse(LiveOrientationPolicy.shouldAutoExitFullscreen(null, 0))\n        assertFalse(LiveOrientationPolicy.shouldAutoExitFullscreen(90, 270))\n    }\n""",
          )

          reducer_test = "app/src/test/java/app/ownplay/mobile/feature/live/domain/LivePresentationReducerTest.kt"
          replace_once(
              reducer_test,
              """    @Test\n    fun backFromFullscreenReturnsToSamePreviewWithoutReload() {\n""",
              """    @Test\n    fun channelSwitchGestureKeepsFullscreenAndLoadsOnlyNewChannel() {\n        val transition = LivePresentationReducer.reduce(\n            LivePresentationState(\n                presentation = LivePresentation.FULLSCREEN,\n                selectedChannelId = \"channel-1\",\n            ),\n            LiveIntent.ChannelSwitched(\"channel-2\"),\n        )\n\n        assertEquals(LivePresentation.FULLSCREEN, transition.state.presentation)\n        assertEquals(\"channel-2\", transition.state.selectedChannelId)\n        assertEquals(listOf(LiveEffect.LoadChannel(\"channel-2\")), transition.effects)\n    }\n\n    @Test\n    fun channelSwitchGestureDoesNotReloadSameChannelOrStartPlaybackFromBrowse() {\n        val fullscreenState = LivePresentationState(\n            presentation = LivePresentation.FULLSCREEN,\n            selectedChannelId = \"channel-1\",\n        )\n        val sameChannel = LivePresentationReducer.reduce(\n            fullscreenState,\n            LiveIntent.ChannelSwitched(\"channel-1\"),\n        )\n        val browse = LivePresentationReducer.reduce(\n            LivePresentationState(),\n            LiveIntent.ChannelSwitched(\"channel-2\"),\n        )\n\n        assertEquals(fullscreenState, sameChannel.state)\n        assertTrue(sameChannel.effects.isEmpty())\n        assertEquals(LivePresentationState(), browse.state)\n        assertTrue(browse.effects.isEmpty())\n    }\n\n    @Test\n    fun backFromFullscreenReturnsToSamePreviewWithoutReload() {\n""",
          )

          gesture_test = Path("app/src/test/java/app/ownplay/mobile/feature/live/ui/LiveGestureNavigationPolicyTest.kt")
          if gesture_test.exists():
              raise SystemExit(f"{gesture_test}: already exists")
          gesture_test.write_text('''package app.ownplay.mobile.feature.live.ui\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertNull\nimport org.junit.Test\n\nclass LiveGestureNavigationPolicyTest {\n    @Test\n    fun `horizontal swipe direction uses a deliberate threshold`() {\n        assertEquals(\n            LiveNavigationDirection.NEXT,\n            LiveGestureNavigationPolicy.directionForHorizontalSwipe(-80f, minDistancePx = 56f),\n        )\n        assertEquals(\n            LiveNavigationDirection.PREVIOUS,\n            LiveGestureNavigationPolicy.directionForHorizontalSwipe(80f, minDistancePx = 56f),\n        )\n        assertNull(LiveGestureNavigationPolicy.directionForHorizontalSwipe(-40f, minDistancePx = 56f))\n        assertNull(LiveGestureNavigationPolicy.directionForHorizontalSwipe(40f, minDistancePx = 56f))\n    }\n\n    @Test\n    fun `adjacent navigation wraps for continuous one handed browsing`() {\n        val keys = listOf(\"one\", \"two\", \"three\")\n\n        assertEquals(\n            \"three\",\n            LiveGestureNavigationPolicy.adjacentKey(keys, \"two\", LiveNavigationDirection.NEXT),\n        )\n        assertEquals(\n            \"one\",\n            LiveGestureNavigationPolicy.adjacentKey(keys, \"two\", LiveNavigationDirection.PREVIOUS),\n        )\n        assertEquals(\n            \"one\",\n            LiveGestureNavigationPolicy.adjacentKey(keys, \"three\", LiveNavigationDirection.NEXT),\n        )\n        assertEquals(\n            \"three\",\n            LiveGestureNavigationPolicy.adjacentKey(keys, \"one\", LiveNavigationDirection.PREVIOUS),\n        )\n    }\n\n    @Test\n    fun `navigation ignores single item lists and resolves missing current key deterministically`() {\n        assertNull(\n            LiveGestureNavigationPolicy.adjacentKey(\n                listOf(\"only\"),\n                \"only\",\n                LiveNavigationDirection.NEXT,\n            ),\n        )\n        assertEquals(\n            \"one\",\n            LiveGestureNavigationPolicy.adjacentKey(\n                listOf(\"one\", \"two\"),\n                \"missing\",\n                LiveNavigationDirection.NEXT,\n            ),\n        )\n        assertEquals(\n            \"two\",\n            LiveGestureNavigationPolicy.adjacentKey(\n                listOf(\"one\", \"two\"),\n                \"missing\",\n                LiveNavigationDirection.PREVIOUS,\n            ),\n        )\n    }\n}\n''')
          PY

          git diff --check
          git status --short

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main app/src/test
          test -n "$(git status --porcelain)"
          git commit -m "Add gesture-first Live navigation"
          git push origin HEAD:stage-31-live-gesture-navigation
