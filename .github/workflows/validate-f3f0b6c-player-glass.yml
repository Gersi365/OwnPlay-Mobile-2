name: Validate exact f3f0b6c player glass source

on:
  push:
    branches:
      - qa-validate-f3f0b6c-player-glass

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: f3f0b6cdec1053d4725bd072f165f519197f70c0

    steps:
      - name: Checkout exact final source
        uses: actions/checkout@v4
        with:
          ref: f3f0b6cdec1053d4725bd072f165f519197f70c0
          persist-credentials: false

      - name: Verify exact final source
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Validated source HEAD: $actual_sha"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate source without APK generation
        shell: bash
        run: bash tools/validate-source-no-apk.sh
