name: Stage 12 Round 4 category and audio

on:
  push:
    branches:
      - stage12-round4-category-audio-helper

permissions:
  contents: write

jobs:
  patch-validate-apply:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 41bd6208dfca9cbe2a6b1d8e98829c6c9e15f8ab
      TARGET_BRANCH: stage-12-stabilization
    steps:
      - name: Checkout helper tooling
        uses: actions/checkout@v4
        with:
          ref: stage12-round4-category-audio-helper
          path: tooling
          persist-credentials: false

      - name: Checkout exact source base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact source and target base
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote" = "$SOURCE_SHA"
          echo "Exact source and target base verified: $SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
          cache-read-only: true

      - name: Apply guarded source patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../tooling/.github/scripts/stage12_round4_patch.py
          python3 ../tooling/.github/scripts/stage12_round4_visibility_escape_fix.py
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit exact source candidate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test docs/audit/STAGE_12_STABILIZATION.txt
          git commit -m "Harden utility categories and expose audio codec diagnostics"
          echo "Candidate HEAD: $(git rev-parse HEAD)"

      - name: Validate exact candidate source without APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          bash tools/validate-source-no-apk.sh
          test "$(git rev-parse HEAD)" = "$candidate"
          test -z "$(git status --porcelain)"
          echo "Validated exact candidate HEAD: $candidate"

      - name: Fast-forward target only after PASS
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote" = "$SOURCE_SHA"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
          final="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$final" = "$candidate"
          echo "Fast-forwarded $TARGET_BRANCH to $final"
