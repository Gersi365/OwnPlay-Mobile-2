name: Stage 12 player local controls exact-head validation

on:
  push:
    branches:
      - stage12-player-local-controls-final-validation

permissions:
  contents: read

jobs:
  validate-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: 5f312e7e47c2f977da0ccaab66d012ed2fded571
          clean: true

      - name: Verify exact source HEAD and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f312e7e47c2f977da0ccaab66d012ed2fded571"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate exact source without APK
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Verify source unchanged after validation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f312e7e47c2f977da0ccaab66d012ed2fded571"
          test -z "$(git status --porcelain)"
