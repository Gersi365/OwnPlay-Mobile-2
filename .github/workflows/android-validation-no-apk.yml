name: Android validation (no APK)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compile, test, lint, and compile Android tests
        run: >-
          gradle --no-daemon
          :app:compileDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestSources

      - name: Verify no APK was produced
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'Unexpected APK output detected.' >&2
            find . -type f -name '*.apk' -print >&2
            exit 1
          fi
          echo 'NO APK: validation produced no APK files.'
