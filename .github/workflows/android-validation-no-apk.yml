name: Android source validation (no APK)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Validated source HEAD: $actual_sha"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
          validate-wrappers: true

      - name: Validate source without APK generation
        id: validate_source
        continue-on-error: true
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Commit generated Room v3 schema
        if: steps.validate_source.outcome == 'failure'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          schema="app/schemas/app.ownplay.mobile.data.db.OwnPlayDatabase/3.json"
          test -f "$schema"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$schema"
          git diff --cached --quiet && exit 1
          git commit -m "Commit generated Room v3 schema"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Preserve validation failure after schema capture
        if: steps.validate_source.outcome == 'failure'
        shell: bash
        run: exit 1
