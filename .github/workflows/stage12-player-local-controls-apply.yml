name: Stage 12 player local controls guarded apply

on:
  push:
    branches:
      - stage12-player-local-controls-runner

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Preserve patch helper
        shell: bash
        run: cp tools/stage12_player_local_controls_patch.py /tmp/stage12_player_local_controls_patch.py

      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: stage-12-stabilization
          clean: true

      - name: Guard exact target base
        shell: bash
        env:
          EXPECTED_BASE: 65bb1545c938126efdbb8413f677cbbf16f48db2
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"
          echo "Exact target base: $actual"

      - name: Apply player-local controls
        shell: bash
        run: |
          python /tmp/stage12_player_local_controls_patch.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate source without APK
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Commit and fast-forward target branch
        shell: bash
        env:
          EXPECTED_BASE: 65bb1545c938126efdbb8413f677cbbf16f48db2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/app/ownplay/mobile/MainActivity.kt \
            app/src/main/java/app/ownplay/mobile/playback/PlaybackController.kt \
            app/src/main/java/app/ownplay/mobile/playback/Media3PlaybackController.kt \
            app/src/main/java/app/ownplay/mobile/playback/domain/PlayerLocalControlPolicy.kt \
            app/src/test/java/app/ownplay/mobile/playback/PlayerLocalControlPolicyTest.kt
          git commit -m "Add player-local volume and brightness controls"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git push origin HEAD:stage-12-stabilization
