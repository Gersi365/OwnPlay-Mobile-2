name: QA APK build

on:
  push:
    branches:
      - qa-apk-build-6eed109

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 6eed1090b623db6402fcaf53600248a1cda04870

    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact QA candidate
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"
          echo "QA candidate HEAD: $actual_sha"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build QA debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect QA metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p qa-artifact
          cp "$APK" qa-artifact/OwnPlay-QA-6eed109.apk
          sha256sum qa-artifact/OwnPlay-QA-6eed109.apk | tee qa-artifact/APK_SHA256.txt
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --print-certs qa-artifact/OwnPlay-QA-6eed109.apk | tee qa-artifact/APKSIGNER_CERTS.txt
          "$AAPT" dump badging qa-artifact/OwnPlay-QA-6eed109.apk | head -n 5 | tee qa-artifact/PACKAGE_BADGING.txt
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "source_branch=stage-11-qa-candidate-preflight"
            echo "artifact=OwnPlay-QA-6eed109.apk"
            echo "build_task=:app:assembleDebug"
          } > qa-artifact/QA_BUILD_METADATA.txt

      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-qa-apk-6eed109
          path: qa-artifact/
          if-no-files-found: error
          retention-days: 14
