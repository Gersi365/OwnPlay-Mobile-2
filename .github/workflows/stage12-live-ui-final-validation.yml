name: Stage 12 Live UI exact-head final validation

on:
  push:
    branches:
      - stage12-live-ui-apply-helper
    paths:
      - .github/workflows/stage12-live-ui-final-validation.yml

permissions:
  contents: read

env:
  SOURCE_SHA: 43b99059a8379a5c6d7c7d14e27c8dfe11f915e9

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact final source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact final source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "Validated final source HEAD: $SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true

      - name: Validate exact final source without APK
        shell: bash
        run: bash tools/validate-source-no-apk.sh
