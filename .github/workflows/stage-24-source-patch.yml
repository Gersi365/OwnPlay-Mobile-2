name: Stage 24 source patch runner

on:
  push:
    branches:
      - stage-24-platform-playback-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add Stage 24 source patch runner'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 24 branch
        uses: actions/checkout@v4
        with:
          ref: stage-24-platform-playback-hardening
          fetch-depth: 0

      - name: Apply Stage 24 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count} for {old!r}")
              target.write_text(text.replace(old, new))

          replace_exact(
              "app/src/main/AndroidManifest.xml",
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
          )

          replace_exact(
              "app/src/main/java/app/ownplay/mobile/MainActivity.kt",
              "import android.Manifest\n",
              "",
          )
          replace_exact(
              "app/src/main/java/app/ownplay/mobile/MainActivity.kt",
              "        requestLegacyPublicDownloadsPermissionIfNeeded()\n",
              "",
          )
          replace_exact(
              "app/src/main/java/app/ownplay/mobile/MainActivity.kt",
              '''\n    private fun requestLegacyPublicDownloadsPermissionIfNeeded() {\n        if (Build.VERSION.SDK_INT > Build.VERSION_CODES.P) {\n            return\n        }\n        if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED) {\n            return\n        }\n        requestPermissions(\n            arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE),\n            REQUEST_PUBLIC_DOWNLOADS_PERMISSION,\n        )\n    }\n\n    private companion object {\n        const val REQUEST_PUBLIC_DOWNLOADS_PERMISSION = 1801\n    }\n''',
              "\n",
          )

          download_controls = "app/src/main/java/app/ownplay/mobile/downloads/ui/DownloadControls.kt"
          replace_exact(
              download_controls,
              "package app.ownplay.mobile.downloads.ui\n\n",
              "package app.ownplay.mobile.downloads.ui\n\nimport android.Manifest\nimport android.content.pm.PackageManager\nimport android.os.Build\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.result.contract.ActivityResultContracts\n",
          )
          replace_exact(
              download_controls,
              "import androidx.compose.runtime.Composable\n",
              "import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\n",
          )
          replace_exact(
              download_controls,
              "import androidx.compose.ui.graphics.Color\n",
              "import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalContext\n",
          )
          replace_exact(
              download_controls,
              "import androidx.compose.ui.unit.dp\n",
              "import androidx.compose.ui.unit.dp\nimport androidx.core.content.ContextCompat\n",
          )
          replace_exact(
              download_controls,
              "import app.ownplay.mobile.downloads.domain.DownloadItem\n",
              "import app.ownplay.mobile.downloads.domain.DownloadItem\nimport app.ownplay.mobile.downloads.domain.DownloadPermissionPolicy\nimport app.ownplay.mobile.downloads.domain.DownloadPermissionPrompt\n",
          )
          replace_exact(
              download_controls,
              ''') {\n    val primaryAction = DownloadStatePolicy.primaryAction(item)\n    Column(\n''',
              ''') {\n    val context = LocalContext.current\n    var pendingDownload by remember { mutableStateOf(false) }\n    var permissionMessage by remember { mutableStateOf<String?>(null) }\n\n    val legacyStoragePermissionLauncher = rememberLauncherForActivityResult(\n        contract = ActivityResultContracts.RequestPermission(),\n    ) { granted ->\n        if (pendingDownload) {\n            pendingDownload = false\n            if (granted) {\n                permissionMessage = null\n                onAction(DownloadAction.DOWNLOAD)\n            } else {\n                permissionMessage = \"Storage permission is required to save public downloads on Android 8 or 9.\"\n            }\n        }\n    }\n    val notificationPermissionLauncher = rememberLauncherForActivityResult(\n        contract = ActivityResultContracts.RequestPermission(),\n    ) {\n        if (pendingDownload) {\n            pendingDownload = false\n            permissionMessage = null\n            onAction(DownloadAction.DOWNLOAD)\n        }\n    }\n\n    fun dispatchAction(action: DownloadAction) {\n        permissionMessage = null\n        if (action != DownloadAction.DOWNLOAD) {\n            onAction(action)\n            return\n        }\n        if (pendingDownload) return\n\n        val legacyStorageGranted = Build.VERSION.SDK_INT > Build.VERSION_CODES.P ||\n            ContextCompat.checkSelfPermission(\n                context,\n                Manifest.permission.WRITE_EXTERNAL_STORAGE,\n            ) == PackageManager.PERMISSION_GRANTED\n        val notificationsGranted = Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||\n            ContextCompat.checkSelfPermission(\n                context,\n                Manifest.permission.POST_NOTIFICATIONS,\n            ) == PackageManager.PERMISSION_GRANTED\n\n        when (\n            DownloadPermissionPolicy.nextPrompt(\n                sdkInt = Build.VERSION.SDK_INT,\n                legacyStorageGranted = legacyStorageGranted,\n                notificationsGranted = notificationsGranted,\n            )\n        ) {\n            DownloadPermissionPrompt.NONE -> onAction(DownloadAction.DOWNLOAD)\n            DownloadPermissionPrompt.LEGACY_PUBLIC_STORAGE -> {\n                pendingDownload = true\n                legacyStoragePermissionLauncher.launch(Manifest.permission.WRITE_EXTERNAL_STORAGE)\n            }\n            DownloadPermissionPrompt.NOTIFICATIONS -> {\n                pendingDownload = true\n                notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n            }\n        }\n    }\n\n    val primaryAction = DownloadStatePolicy.primaryAction(item)\n    Column(\n''',
          )
          replace_exact(
              download_controls,
              "onClick = { onAction(primaryAction) },",
              "onClick = { dispatchAction(primaryAction) },",
              expected=2,
          )
          replace_exact(
              download_controls,
              "onClick = { onAction(DownloadAction.REMOVE) },",
              "onClick = { dispatchAction(DownloadAction.REMOVE) },",
              expected=2,
          )
          replace_exact(
              download_controls,
              '''\n        Row(\n            modifier = if (compact) Modifier else Modifier.fillMaxWidth(),\n''',
              '''\n        permissionMessage?.let { message ->\n            Text(\n                text = message,\n                style = MaterialTheme.typography.bodySmall,\n                color = OwnPlayColors.TextSecondary,\n            )\n        }\n\n        Row(\n            modifier = if (compact) Modifier else Modifier.fillMaxWidth(),\n''',
          )

          Path("app/src/main/java/app/ownplay/mobile/downloads/domain/DownloadPermissionPolicy.kt").write_text('''package app.ownplay.mobile.downloads.domain\n\nenum class DownloadPermissionPrompt {\n    NONE,\n    LEGACY_PUBLIC_STORAGE,\n    NOTIFICATIONS,\n}\n\nobject DownloadPermissionPolicy {\n    private const val ANDROID_9_API = 28\n    private const val ANDROID_13_API = 33\n\n    fun nextPrompt(\n        sdkInt: Int,\n        legacyStorageGranted: Boolean,\n        notificationsGranted: Boolean,\n    ): DownloadPermissionPrompt = when {\n        sdkInt <= ANDROID_9_API && !legacyStorageGranted -> DownloadPermissionPrompt.LEGACY_PUBLIC_STORAGE\n        sdkInt >= ANDROID_13_API && !notificationsGranted -> DownloadPermissionPrompt.NOTIFICATIONS\n        else -> DownloadPermissionPrompt.NONE\n    }\n}\n''')

          playback_models = "app/src/main/java/app/ownplay/mobile/playback/domain/PlaybackModels.kt"
          replace_exact(
              playback_models,
              '''    val errorCode: Int? = null,\n)\n''',
              '''    val errorCode: Int? = null,\n    val errorCodeName: String? = null,\n    val errorMessage: String? = null,\n)\n''',
          )

          Path("app/src/main/java/app/ownplay/mobile/playback/PlaybackFailureDiagnostics.kt").write_text('''package app.ownplay.mobile.playback\n\nimport androidx.media3.common.PlaybackException\n\ninternal object PlaybackFailureDiagnostics {\n    fun safeMessage(errorCode: Int): String = when (errorCode) {\n        PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW ->\n            \"Live stream moved ahead. Retry to reconnect.\"\n        PlaybackException.ERROR_CODE_TIMEOUT,\n        PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_TIMEOUT,\n        -> \"Playback timed out. Check the connection and retry.\"\n        PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_FAILED ->\n            \"Network connection failed. Check connectivity and retry.\"\n        PlaybackException.ERROR_CODE_IO_BAD_HTTP_STATUS ->\n            \"The media source rejected the playback request. Retry or refresh the source.\"\n        PlaybackException.ERROR_CODE_IO_INVALID_HTTP_CONTENT_TYPE ->\n            \"The media source returned an unexpected response. Retry or refresh the source.\"\n        PlaybackException.ERROR_CODE_IO_CLEARTEXT_NOT_PERMITTED ->\n            \"Android blocked this HTTP connection.\"\n        PlaybackException.ERROR_CODE_IO_FILE_NOT_FOUND ->\n            \"The media file is no longer available.\"\n        PlaybackException.ERROR_CODE_IO_NO_PERMISSION ->\n            \"Android denied access to the media file.\"\n        PlaybackException.ERROR_CODE_PARSING_CONTAINER_MALFORMED,\n        PlaybackException.ERROR_CODE_PARSING_MANIFEST_MALFORMED,\n        -> \"The media stream is malformed and could not be read.\"\n        PlaybackException.ERROR_CODE_PARSING_CONTAINER_UNSUPPORTED,\n        PlaybackException.ERROR_CODE_PARSING_MANIFEST_UNSUPPORTED,\n        -> \"This stream format is not supported.\"\n        PlaybackException.ERROR_CODE_DECODER_INIT_FAILED,\n        PlaybackException.ERROR_CODE_DECODER_QUERY_FAILED,\n        PlaybackException.ERROR_CODE_DECODING_FAILED,\n        PlaybackException.ERROR_CODE_DECODING_FORMAT_EXCEEDS_CAPABILITIES,\n        PlaybackException.ERROR_CODE_DECODING_FORMAT_UNSUPPORTED,\n        PlaybackException.ERROR_CODE_DECODING_RESOURCES_RECLAIMED,\n        -> \"This device could not decode the media format.\"\n        PlaybackException.ERROR_CODE_AUDIO_TRACK_INIT_FAILED,\n        PlaybackException.ERROR_CODE_AUDIO_TRACK_WRITE_FAILED,\n        PlaybackException.ERROR_CODE_AUDIO_TRACK_OFFLOAD_INIT_FAILED,\n        PlaybackException.ERROR_CODE_AUDIO_TRACK_OFFLOAD_WRITE_FAILED,\n        -> \"Audio output failed. Retry playback.\"\n        in PlaybackException.ERROR_CODE_DRM_UNSPECIFIED..PlaybackException.ERROR_CODE_DRM_LICENSE_EXPIRED ->\n            \"Protected media could not be played on this device.\"\n        else -> \"Playback unavailable. Retry playback.\"\n    }\n}\n''')

          controller = "app/src/main/java/app/ownplay/mobile/playback/Media3PlaybackController.kt"
          replace_exact(
              controller,
              "import androidx.media3.common.C\n",
              "import androidx.media3.common.AudioAttributes\nimport androidx.media3.common.C\n",
          )
          replace_exact(
              controller,
              '''        override fun onPlayerError(error: PlaybackException) {\n            refreshSnapshot(errorCode = error.errorCode)\n        }\n''',
              '''        override fun onPlayerError(error: PlaybackException) {\n            Log.w(\n                \"OwnPlayPlayback\",\n                \"Playback failure: ${error.getErrorCodeName()} (${error.errorCode})\",\n            )\n            refreshSnapshot(errorCode = error.errorCode)\n        }\n''',
          )
          replace_exact(
              controller,
              "            mutableState.value = mutableState.value.copy(errorCode = null)\n",
              "            mutableState.value = mutableState.value.copy(\n                errorCode = null,\n                errorCodeName = null,\n                errorMessage = null,\n            )\n",
          )
          replace_exact(
              controller,
              '''        val mediaSourceFactory = DefaultMediaSourceFactory(context)\n            .setDataSourceFactory(dataSourceFactory)\n        return ExoPlayer.Builder(context, renderersFactory)\n            .setMediaSourceFactory(mediaSourceFactory)\n            .setLooper(Looper.getMainLooper())\n            .build()\n''',
              '''        val mediaSourceFactory = DefaultMediaSourceFactory(context)\n            .setDataSourceFactory(dataSourceFactory)\n        val audioAttributes = AudioAttributes.Builder()\n            .setUsage(C.USAGE_MEDIA)\n            .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)\n            .build()\n        return ExoPlayer.Builder(context, renderersFactory)\n            .setMediaSourceFactory(mediaSourceFactory)\n            .setAudioAttributes(audioAttributes, true)\n            .setHandleAudioBecomingNoisy(true)\n            .setLooper(Looper.getMainLooper())\n            .build()\n''',
          )
          replace_exact(
              controller,
              '''        val media = currentMedia\n        val audio = currentAudioTrackStatus()\n        mutableState.value = PlaybackSnapshot(\n''',
              '''        val media = currentMedia\n        val audio = currentAudioTrackStatus()\n        val errorCodeName = errorCode?.let { PlaybackException.getErrorCodeName(it) }\n        val errorMessage = errorCode?.let(PlaybackFailureDiagnostics::safeMessage)\n        mutableState.value = PlaybackSnapshot(\n''',
          )
          replace_exact(
              controller,
              '''            audioSampleRate = audio.sampleRate,\n            errorCode = errorCode,\n        )\n''',
              '''            audioSampleRate = audio.sampleRate,\n            errorCode = errorCode,\n            errorCodeName = errorCodeName,\n            errorMessage = errorMessage,\n        )\n''',
          )

          replace_exact(
              "app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt",
              '                            PlaybackPhase.ERROR -> "Playback unavailable"\n',
              '                            PlaybackPhase.ERROR -> playerState.errorMessage ?: "Playback unavailable"\n',
          )
          replace_exact(
              "app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt",
              '                            playbackSnapshot.phase == PlaybackPhase.ERROR -> "Playback unavailable"\n',
              '                            playbackSnapshot.phase == PlaybackPhase.ERROR -> playbackSnapshot.errorMessage ?: "Playback unavailable"\n',
          )

          Path("app/src/test/java/app/ownplay/mobile/downloads/domain/DownloadPermissionPolicyTest.kt").write_text('''package app.ownplay.mobile.downloads.domain\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass DownloadPermissionPolicyTest {\n    @Test\n    fun `legacy public storage is requested only through Android 9`() {\n        assertEquals(\n            DownloadPermissionPrompt.LEGACY_PUBLIC_STORAGE,\n            DownloadPermissionPolicy.nextPrompt(28, legacyStorageGranted = false, notificationsGranted = true),\n        )\n        assertEquals(\n            DownloadPermissionPrompt.NONE,\n            DownloadPermissionPolicy.nextPrompt(29, legacyStorageGranted = false, notificationsGranted = true),\n        )\n    }\n\n    @Test\n    fun `notification permission is requested from Android 13`() {\n        assertEquals(\n            DownloadPermissionPrompt.NOTIFICATIONS,\n            DownloadPermissionPolicy.nextPrompt(33, legacyStorageGranted = true, notificationsGranted = false),\n        )\n        assertEquals(\n            DownloadPermissionPrompt.NONE,\n            DownloadPermissionPolicy.nextPrompt(32, legacyStorageGranted = true, notificationsGranted = false),\n        )\n    }\n\n    @Test\n    fun `no prompt is needed when applicable permissions are granted`() {\n        assertEquals(\n            DownloadPermissionPrompt.NONE,\n            DownloadPermissionPolicy.nextPrompt(36, legacyStorageGranted = true, notificationsGranted = true),\n        )\n    }\n}\n''')

          Path("app/src/test/java/app/ownplay/mobile/playback/PlaybackFailureDiagnosticsTest.kt").write_text('''package app.ownplay.mobile.playback\n\nimport androidx.media3.common.PlaybackException\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass PlaybackFailureDiagnosticsTest {\n    @Test\n    fun `network failures expose safe connection guidance`() {\n        val message = PlaybackFailureDiagnostics.safeMessage(\n            PlaybackException.ERROR_CODE_IO_NETWORK_CONNECTION_FAILED,\n        )\n        assertTrue(message.contains(\"Network\", ignoreCase = true))\n    }\n\n    @Test\n    fun `http status failures do not expose request details`() {\n        val message = PlaybackFailureDiagnostics.safeMessage(\n            PlaybackException.ERROR_CODE_IO_BAD_HTTP_STATUS,\n        )\n        assertTrue(message.contains(\"source\", ignoreCase = true))\n        assertTrue(!message.contains(\"http://\", ignoreCase = true))\n        assertTrue(!message.contains(\"https://\", ignoreCase = true))\n    }\n\n    @Test\n    fun `unsupported parsing failures identify stream format`() {\n        val message = PlaybackFailureDiagnostics.safeMessage(\n            PlaybackException.ERROR_CODE_PARSING_CONTAINER_UNSUPPORTED,\n        )\n        assertTrue(message.contains(\"format\", ignoreCase = true))\n    }\n\n    @Test\n    fun `decoder failures identify device decode limitation`() {\n        val message = PlaybackFailureDiagnostics.safeMessage(\n            PlaybackException.ERROR_CODE_DECODING_FORMAT_UNSUPPORTED,\n        )\n        assertTrue(message.contains(\"decode\", ignoreCase = true))\n    }\n}\n''')
          PY

          git diff --check
          git status --short

      - name: Commit Stage 24 source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app/src/main app/src/test
          test -n "$(git status --porcelain app/src/main app/src/test)"
          git commit -m "Stage 24: harden permissions and playback behavior"
          git push origin HEAD:stage-24-platform-playback-hardening
