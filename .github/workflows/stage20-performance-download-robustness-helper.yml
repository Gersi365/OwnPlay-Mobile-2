name: Stage 20 source apply and validate

on:
  push:
    branches:
      - stage-20-performance-download-robustness-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: c537c38907371df369a15549d62e8bd5bcacc50a
      TARGET_BRANCH: stage-20-performance-download-robustness

    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Stage deterministic helper inputs
        shell: bash
        run: |
          rm -rf /tmp/stage20
          cp -R tools/stage20 /tmp/stage20

      - name: Verify base and apply Stage 20
        shell: bash
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python /tmp/stage20/apply_stage20_ui.py /tmp/stage20
          python /tmp/stage20/apply_stage20_data.py /tmp/stage20
          git diff --check

          cat > /tmp/expected-files <<'EOF'
          app/src/main/java/app/ownplay/mobile/core/OwnPlayServices.kt
          app/src/main/java/app/ownplay/mobile/data/db/Daos.kt
          app/src/main/java/app/ownplay/mobile/design/RemoteImageLoader.kt
          app/src/main/java/app/ownplay/mobile/downloads/data/DownloadDestinationPolicy.kt
          app/src/main/java/app/ownplay/mobile/downloads/data/DownloadRepositoryImpl.kt
          app/src/main/java/app/ownplay/mobile/downloads/data/PublicDownloadFileStore.kt
          app/src/main/java/app/ownplay/mobile/feature/library/ui/LibraryShell.kt
          app/src/main/java/app/ownplay/mobile/feature/live/ui/LiveShell.kt
          app/src/test/java/app/ownplay/mobile/downloads/data/DownloadDestinationPolicyTest.kt
          docs/audit/STAGE20_PERFORMANCE_DOWNLOAD_ROBUSTNESS_SOURCE_AUDIT.md
          EOF
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate source without APK generation
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Verify no package artifacts and commit
        shell: bash
        run: |
          if find app/build -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo "Unexpected APK/AAB generated"
            exit 1
          fi
          test -z "$(git diff --name-only "$BASE_SHA" -- 'app/schemas' || true)"
          git config user.name "Gersi365"
          git config user.email "Gersi365@outlook.com"
          git add app docs/audit/STAGE20_PERFORMANCE_DOWNLOAD_ROBUSTNESS_SOURCE_AUDIT.md
          git commit -m "Improve image loading and download robustness"
          git push origin "HEAD:$TARGET_BRANCH"
