name: Stage 12 round 4 critical source fixes

on:
  push:
    branches:
      - stage12-round4-critical-runner

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: c5ead94829c906348ddb3fa15ed898ee7f7818bd
      CANDIDATE_BRANCH: stage12-round4-critical-candidate

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pin exact source base and preserve helper
        shell: bash
        run: |
          set -euo pipefail
          cp tools/stage12_round4_critical_patch.py /tmp/stage12_round4_critical_patch.py
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply QA-critical fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/stage12_round4_critical_patch.py
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true

      - name: Validate source without APK generation
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Commit validated source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/ownplay/mobile/feature/live/data/LiveRepositoryImpl.kt \
                  app/src/main/java/app/ownplay/mobile/sources/data/xtream/OkHttpXtreamClient.kt \
                  app/src/main/java/app/ownplay/mobile/sources/data/xtream/XtreamEpgTextPolicy.kt \
                  app/src/test/java/app/ownplay/mobile/sources/data/xtream/XtreamEpgTextPolicyTest.kt \
                  app/src/main/java/app/ownplay/mobile/feature/settings/ui/SettingsShell.kt \
                  app/src/main/java/app/ownplay/mobile/app/OwnPlayApp.kt \
                  app/src/main/java/app/ownplay/mobile/MainActivity.kt \
                  docs/audit/STAGE_12_STABILIZATION.txt
          git commit -m "Fix provider EPG and back hierarchy"
          git push origin HEAD:refs/heads/$CANDIDATE_BRANCH
          echo "candidateSha=$(git rev-parse HEAD)"
