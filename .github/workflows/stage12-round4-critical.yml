name: Stage 12 round 4 critical source fixes

on:
  push:
    branches:
      - stage12-round4-critical-runner

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: c5ead94829c906348ddb3fa15ed898ee7f7818bd
      CANDIDATE_BRANCH: stage12-round4-critical-candidate

    steps:
      - name: Checkout exact source base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact clean base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply QA-critical fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_str}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          # Provider utility streams such as "Account Information" remain in raw Room data,
          # but are excluded from the user-facing Live catalog just like utility categories.
          live_repo = "app/src/main/java/app/ownplay/mobile/feature/live/data/LiveRepositoryImpl.kt"
          replace_one(
              live_repo,
              "import app.ownplay.mobile.sources.domain.SourceCredential\n",
              "import app.ownplay.mobile.sources.domain.ProviderCategoryVisibility\nimport app.ownplay.mobile.sources.domain.SourceCredential\n",
          )
          replace_one(
              live_repo,
              "                        channels = channelRows.map { row ->\n",
              "                        channels = channelRows\n                            .filterNot { row -> ProviderCategoryVisibility.isUtilityLabel(row.name) }\n                            .map { row ->\n",
          )

          # Decode provider EPG titles at the Xtream boundary instead of leaking encoded payloads to UI.
          xtream_client = "app/src/main/java/app/ownplay/mobile/sources/data/xtream/OkHttpXtreamClient.kt"
          replace_one(
              xtream_client,
              "                            title = obj[\"title\"]?.text().orEmpty(),\n",
              "                            title = XtreamEpgTextPolicy.decode(obj[\"title\"]?.text().orEmpty()),\n",
          )

          policy = Path("app/src/main/java/app/ownplay/mobile/sources/data/xtream/XtreamEpgTextPolicy.kt")
          policy.write_text(r'''package app.ownplay.mobile.sources.data.xtream

import java.nio.ByteBuffer
import java.nio.charset.CodingErrorAction
import java.nio.charset.StandardCharsets
import java.util.Base64

object XtreamEpgTextPolicy {
    private val base64Shape = Regex("^[A-Za-z0-9+/=_-]+$")
    private val decimalEntity = Regex("&#(\\d+);")
    private val hexadecimalEntity = Regex("&#x([0-9A-Fa-f]+);")

    fun decode(raw: String): String {
        val trimmed = raw.trim()
        if (trimmed.isEmpty()) return ""
        val text = decodeBase64Candidate(trimmed) ?: trimmed
        return decodeHtmlEntities(text).trim()
    }

    private fun decodeBase64Candidate(value: String): String? {
        val compact = value.filterNot(Char::isWhitespace)
        if (compact.length < 8 || compact.length % 4 == 1 || !base64Shape.matches(compact)) {
            return null
        }
        val padding = (4 - compact.length % 4) % 4
        val padded = compact + "=".repeat(padding)
        return sequenceOf(Base64.getDecoder(), Base64.getUrlDecoder())
            .mapNotNull { decoder -> runCatching { decoder.decode(padded) }.getOrNull() }
            .mapNotNull(::decodeUtf8Strict)
            .firstOrNull(::looksHumanReadable)
    }

    private fun decodeUtf8Strict(bytes: ByteArray): String? = runCatching {
        StandardCharsets.UTF_8.newDecoder()
            .onMalformedInput(CodingErrorAction.REPORT)
            .onUnmappableCharacter(CodingErrorAction.REPORT)
            .decode(ByteBuffer.wrap(bytes))
            .toString()
    }.getOrNull()

    private fun looksHumanReadable(value: String): Boolean {
        val text = value.trim()
        if (text.isEmpty() || text.none(Char::isLetterOrDigit)) return false
        val printable = text.count { character ->
            !Character.isISOControl(character) || character == '\n' || character == '\t'
        }
        return printable.toDouble() / text.length >= 0.90
    }

    private fun decodeHtmlEntities(value: String): String {
        var result = value
            .replace("&amp;", "&", ignoreCase = true)
            .replace("&quot;", "\"", ignoreCase = true)
            .replace("&apos;", "'", ignoreCase = true)
            .replace("&#39;", "'", ignoreCase = true)
            .replace("&lt;", "<", ignoreCase = true)
            .replace("&gt;", ">", ignoreCase = true)

        result = decimalEntity.replace(result) { match ->
            codePoint(match.groupValues[1].toIntOrNull(), match.value)
        }
        result = hexadecimalEntity.replace(result) { match ->
            codePoint(match.groupValues[1].toIntOrNull(16), match.value)
        }
        return result
    }

    private fun codePoint(value: Int?, fallback: String): String {
        if (value == null || !Character.isValidCodePoint(value)) return fallback
        return runCatching { String(Character.toChars(value)) }.getOrDefault(fallback)
    }
}
''')

          policy_test = Path("app/src/test/java/app/ownplay/mobile/sources/data/xtream/XtreamEpgTextPolicyTest.kt")
          policy_test.parent.mkdir(parents=True, exist_ok=True)
          policy_test.write_text(r'''package app.ownplay.mobile.sources.data.xtream

import java.util.Base64
import org.junit.Assert.assertEquals
import org.junit.Test

class XtreamEpgTextPolicyTest {
    @Test
    fun plainProgramTitleIsPreserved() {
        assertEquals("Evening News", XtreamEpgTextPolicy.decode(" Evening News "))
    }

    @Test
    fun base64ProgramTitleIsDecoded() {
        val encoded = Base64.getEncoder().encodeToString("UEFA Champions League".toByteArray(Charsets.UTF_8))
        assertEquals("UEFA Champions League", XtreamEpgTextPolicy.decode(encoded))
    }

    @Test
    fun utf8AndHtmlEntitiesAreDecoded() {
        val encoded = Base64.getEncoder().encodeToString("Këngë &amp; Histori".toByteArray(Charsets.UTF_8))
        assertEquals("Këngë & Histori", XtreamEpgTextPolicy.decode(encoded))
    }

    @Test
    fun malformedCandidateFallsBackToRawText() {
        assertEquals("https://example.invalid/epg", XtreamEpgTextPolicy.decode("https://example.invalid/epg"))
    }
}
''')

          # Android back gesture follows the same hierarchy. Settings child pages consume back first.
          settings_shell = "app/src/main/java/app/ownplay/mobile/feature/settings/ui/SettingsShell.kt"
          replace_one(
              settings_shell,
              "package app.ownplay.mobile.feature.settings.ui\n\n",
              "package app.ownplay.mobile.feature.settings.ui\n\nimport androidx.activity.compose.BackHandler\n",
          )
          replace_one(
              settings_shell,
              "    val page = runCatching { SettingsPage.valueOf(pageName) }.getOrDefault(SettingsPage.MAIN)\n\n    when (page) {\n",
              "    val page = runCatching { SettingsPage.valueOf(pageName) }.getOrDefault(SettingsPage.MAIN)\n\n    BackHandler(enabled = page != SettingsPage.MAIN) {\n        pageName = SettingsPage.MAIN.name\n    }\n\n    when (page) {\n",
          )

          # Root back never terminates silently: after inner handlers are exhausted, confirm exit.
          app_file = "app/src/main/java/app/ownplay/mobile/app/OwnPlayApp.kt"
          replace_one(
              app_file,
              "package app.ownplay.mobile.app\n\n",
              "package app.ownplay.mobile.app\n\nimport androidx.activity.compose.BackHandler\n",
          )
          replace_one(
              app_file,
              "import androidx.compose.material3.Scaffold\n",
              "import androidx.compose.material3.AlertDialog\nimport androidx.compose.material3.Scaffold\nimport androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\n",
          )
          replace_one(
              app_file,
              "    onFullscreenChanged: (Boolean) -> Unit = {},\n) {\n",
              "    onFullscreenChanged: (Boolean) -> Unit = {},\n    onExitConfirmed: () -> Unit = {},\n) {\n",
          )
          replace_one(
              app_file,
              "        var contentFullscreen by rememberSaveable { mutableStateOf(false) }\n        val scope = rememberCoroutineScope()\n",
              "        var contentFullscreen by rememberSaveable { mutableStateOf(false) }\n        var exitConfirmationVisible by rememberSaveable { mutableStateOf(false) }\n        val scope = rememberCoroutineScope()\n",
          )
          replace_one(
              app_file,
              "        Scaffold(\n",
              '''        BackHandler {\n            exitConfirmationVisible = true\n        }\n\n        if (exitConfirmationVisible) {\n            AlertDialog(\n                onDismissRequest = { exitConfirmationVisible = false },\n                title = { Text("Exit OwnPlay?") },\n                text = { Text("Do you want to close OwnPlay?") },\n                confirmButton = {\n                    TextButton(onClick = onExitConfirmed) { Text("Exit") }\n                },\n                dismissButton = {\n                    TextButton(onClick = { exitConfirmationVisible = false }) { Text("Cancel") }\n                },\n            )\n        }\n\n        Scaffold(\n''',
          )

          main_activity = "app/src/main/java/app/ownplay/mobile/MainActivity.kt"
          replace_one(
              main_activity,
              "                onFullscreenChanged = { fullscreen ->\n",
              "                onExitConfirmed = { finish() },\n                onFullscreenChanged = { fullscreen ->\n",
          )

          audit = Path("docs/audit/STAGE_12_STABILIZATION.txt")
          audit.write_text(audit.read_text() + '''\n\nRound 4 physical-QA critical corrections\n- System utility labels are now filtered when a provider exposes them as Live streams/channels, while raw provider rows remain persisted.\n- Xtream short-EPG titles are decoded at the provider boundary when Base64/HTML-encoded.\n- Android Back gesture now returns Settings child pages to Settings main and root Back opens an explicit OwnPlay exit confirmation instead of silently finishing the Activity.\n- No APK/AAB generated by source validation.\n''')
          PY

          git diff --check
          test -n "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true

      - name: Validate source without APK generation
        shell: bash
        run: bash tools/validate-source-no-apk.sh

      - name: Commit validated source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/ownplay/mobile/feature/live/data/LiveRepositoryImpl.kt \
                  app/src/main/java/app/ownplay/mobile/sources/data/xtream/OkHttpXtreamClient.kt \
                  app/src/main/java/app/ownplay/mobile/sources/data/xtream/XtreamEpgTextPolicy.kt \
                  app/src/test/java/app/ownplay/mobile/sources/data/xtream/XtreamEpgTextPolicyTest.kt \
                  app/src/main/java/app/ownplay/mobile/feature/settings/ui/SettingsShell.kt \
                  app/src/main/java/app/ownplay/mobile/app/OwnPlayApp.kt \
                  app/src/main/java/app/ownplay/mobile/MainActivity.kt \
                  docs/audit/STAGE_12_STABILIZATION.txt
          git commit -m "Fix provider EPG and back hierarchy"
          git push origin HEAD:refs/heads/$CANDIDATE_BRANCH
          echo "candidateSha=$(git rev-parse HEAD)"
