name: Stage 32 follow-up patch helper

on:
  push:
    branches:
      - stage-32-interaction-orientation-contract
    paths:
      - tools/stage32_followup_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-32-interaction-orientation-contract
          fetch-depth: 0
      - run: python3 tools/stage32_followup_patch.py
      - run: |
          set -euo pipefail
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m 'Stage 32: gate fullscreen before player presentation'
          git push origin HEAD:stage-32-interaction-orientation-contract
