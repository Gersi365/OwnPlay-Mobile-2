name: Stage 30 QA v26 unsigned APK

on:
  push:
    branches:
      - stage-30-qa-build-v26

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Stage 30 source
        uses: actions/checkout@v4
        with:
          ref: 2eabf3ff9402899261133e9da5336e92f7af3f32
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2eabf3ff9402899261133e9da5336e92f7af3f32"
          test -z "$(git status --porcelain)"
          echo "QA source HEAD: $(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Inject QA versionCode 26 in build workspace only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = '        versionCode = 1\n'
          new = '        versionCode = 26\n'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one versionCode = 1 declaration')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "app/build.gradle.kts"
          grep -F 'versionCode = 26' app/build.gradle.kts

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Zipalign unsigned APK and verify metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk OwnPlay-QA-2eabf3f-v26-unsigned-aligned.apk
          "$BT/zipalign" -c -v 4 OwnPlay-QA-2eabf3f-v26-unsigned-aligned.apk
          "$BT/aapt2" dump badging OwnPlay-QA-2eabf3f-v26-unsigned-aligned.apk | head -n 5
          sha256sum OwnPlay-QA-2eabf3f-v26-unsigned-aligned.apk
          printf '%s\n' 'source_sha=2eabf3ff9402899261133e9da5336e92f7af3f32' 'versionCode=26' > QA-BUILD-METADATA.txt

      - name: Upload unsigned aligned QA APK
        uses: actions/upload-artifact@v4
        with:
          name: OwnPlay-QA-2eabf3f-v26-unsigned
          path: |
            OwnPlay-QA-2eabf3f-v26-unsigned-aligned.apk
            QA-BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 7
